          type: integer
    get:
      tags: [ Departments ]
      summary: Show a department
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Departments ]
      summary: Update a department
      description: >-
        Restricted to authenticated active main managers only. Partial updates
        may include code, name, and `is_active`. Set `is_active` to false to
        deactivate or true to reactivate; this is the sole activation path (no
        `/disable` route). Deactivation returns **409** when the department is
        still referenced by existing records.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Departments ]
      summary: Replace/update a department
      description: Same behavior and validation as PATCH /api/departments/{departmentId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Departments ]
      summary: Delete a department
      description: >-
        Hard deletes the department row. Departments assigned to any manager or
        officer cannot be deleted until those actor assignments are changed.
        Once no actors reference the department, the category_department pivot
        uses database-level cascade deletes, and department_issue cascades the
        issue pivot assignments, so deleting a department removes only those
        assignments while leaving categories and issue rows intact. Issue
        responses expose derived read-only departments as an array. Restricted to
        authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Department deleted; category and issue pivot assignments removed automatically
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

