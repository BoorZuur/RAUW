        currently assigned to the issue may update it (**403**
        `not_assigned_officer` otherwise). Only the officer who authored the
        update may modify it (**403** `not_update_author` otherwise). Officers
        without an active shared shift receive **403** `hub_active_required`.
        District scoping applies (**403** `officer_not_in_district`). Blocked
        when issue status is `gesloten` (**422** `issue_closed`); issues in
        `opgelost` remain writable. Send `remove_attachment_ids` to delete
        owned attachments before uploading replacements. Total attachments after
        removals plus new files must not exceed **3**. New uploads are
        content-sniffed as allowed images. Returns **404** when the update does
        not exist on the issue.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OfficerIssueUpdateUpdate'
      responses:
        '200':
          description: Updated update
          content:
