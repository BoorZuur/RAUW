  /api/issues/{issueId}/feedback:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issue Feedback ]
      summary: List feedback for an issue
      description: >-
        List user satisfaction feedback on a closed-issue participant workflow.
        Returns an **unpaginated** collection sorted by default query order
        (database insertion order). Any actor who cannot view the parent issue
        receives **404**. Officers may call without an active shared shift
        (**Tier B**). Visibility matrix: **users** see only their own row
        (`reviewer_user_id` equals actor id); **officers** see all rows when they
        were ever assigned to the issue or authored its officer resolution
        (`IssueFeedbackOfficerAccess`), otherwise **403**; **managers** see all
        rows on visible issues. Reviewer objects use `IssueCommentAuthor` anonymity
        rules (owners see real identity; other viewers see stable participant
        aliases). Distinct from officer field reports in
        `officer_issue_resolutions`.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Unpaginated collection of feedback rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Issue Feedback ]
      summary: Submit satisfaction feedback
      description: >-
        Submit one satisfaction rating per participant on a **closed**
        (`gesloten`) issue. Active **users** who are issue participants may
        create feedback within **7×24 hours** after the issue was last closed
        (`IssueFeedbackWindow::isOpen`). Officers without an active shared shift
        receive **403** `hub_active_required` if they attempt this route
        (**Tier C**), but the endpoint is user-only and normally returns **403**
        `This action is unauthorized.` for non-users. Blocked when the issue is
        not closed (**403** `feedback_not_allowed`), outside the 7-day window
        (**403** `feedback_window_closed`), or the user is not a participant
        (**403** `not_issue_participant`). Duplicate `(issue_id, reviewer_user_id)`
        returns **409** `feedback_already_submitted`. Optional `comment` is limited
        to 2000 characters.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedbackCreate'
            example:
              is_satisfied: true
              comment: De melding is netjes opgelost.
      responses:
        '201':
          description: Created feedback row
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (feedback rules or inactive account)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedbackError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                feedback_not_allowed:
                  summary: Issue is not closed
                  value:
                    message: feedback_not_allowed
                    code: feedback_not_allowed
                feedback_window_closed:
                  summary: Outside 7-day submit window
                  value:
                    message: feedback_window_closed
                    code: feedback_window_closed
                not_issue_participant:
                  summary: User is not a participant
                  value:
                    message: not_issue_participant
                    code: not_issue_participant
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Feedback already submitted for this issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedbackConflictError'
              example:
                message: Feedback has already been submitted for this issue.
                code: feedback_already_submitted
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/feedback/{feedbackId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: feedbackId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issue Feedback ]
      summary: Update own feedback
      description: >-
        Update satisfaction or comment on feedback the authenticated user
        submitted. Only the reviewer (`reviewer_user_id`) may update. Officers
        without an active shared shift receive **403** `hub_active_required`
        (**Tier C**); non-owners receive **403** from authorization. Requires
        issue status `gesloten` (**403** `feedback_not_allowed`), an open 7-day
        submit window (**403** `feedback_window_closed`), and an open **24-hour**
        edit window from `submitted_at` (**403** `feedback_edit_window_closed`).
        When `{feedbackId}` does not belong to `{issueId}`, returns **404** (IDOR
        guard). Sets `updated_at` on successful save.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedbackUpdate'
            example:
              is_satisfied: false
              comment: Toch nog niet helemaal tevreden.
      responses:
        '200':
          description: Updated feedback row
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (ownership, windows, or inactive account)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedbackError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                feedback_edit_window_closed:
                  summary: Outside 24-hour edit window
                  value:
                    message: feedback_edit_window_closed
                    code: feedback_edit_window_closed
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Issue Feedback ]
      summary: Delete own feedback
      description: >-
        Delete feedback the authenticated user submitted. Same authorization,
        window, nested-id, and Tier C rules as PATCH. Returns **204** with no
        body on success.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Feedback deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (ownership, windows, or inactive account)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedbackError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/officer-resolution/attachments/{attachmentId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [ Issues ]
      summary: Delete officer resolution attachment
      description: >-
        Hard delete one attachment from the issue's officer resolution. Current
        assignee only; non-assignees receive **403** `not_assigned_officer`.
        Repeat DELETE returns **404** once the row is gone (route model binding).
        **Tier C** for officers (`hub_active_required` without active shared
        shift). District scoping applies (`officer_not_in_district`). Issue
        must be viewable; hidden or out-of-scope issues return **404**.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Attachment deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (assignee, district, hub-active, or inactive account)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/community-posts:
    get:
      tags: [ Community Posts ]
      summary: List community posts
      description: >-
        Paginated community news feed for any authenticated active actor.
        Scoping uses `CommunityPostFeedQuery` and `CommunityPostVisibilityQuery`:
        users see only `visible` posts in subscribed feed districts
        (`feedDistricts`); officers and managers see `visible` and `hidden`
        posts within their feed scope (assigned districts or city-wide).
        Optional `district_id` narrows within the actor's feed scope.
        Users may pass `saved_only=1` to list only posts they saved (ignored for
        officers and managers). User list responses include `is_saved` on each
        post when applicable. Officers may call this without a hub-active shift
        (Tier B). Default page size is 15.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: district_id
          in: query
          required: false
          schema:
            type: integer
          description: Optional district filter within the actor's feed scope.
        - name: saved_only
          in: query
          required: false
          schema:
            type: boolean
          description: Users only. When true, return only saved posts.
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Paginated community posts
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/CommunityPostPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ Community Posts ]
      summary: Create a community post
      description: >-
        Create a community post as an authenticated active officer with an active
        shared shift (Tier C). The officer must be assigned to the target
        `district_id`; otherwise the backend returns **403** with
        `You are not assigned to this district.` Users and managers receive
        **403** from FormRequest authorization.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/CommunityPostCreate'
            example:
              district_id: 1
              title: Wijkupdate parkeerregels
              content: Vanaf volgende week gelden nieuwe parkeerregels in Cool.
              visibility: visible
      responses:
        '201':
          description: Community post created
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/CommunityPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden. Users and managers receive `This action is unauthorized.`
            Officers without an active shared shift receive `hub_active_required`.
            Officers not assigned to `district_id` receive
            `You are not assigned to this district.`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                hubActiveRequired:
                  summary: Officer without active shared shift
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/community-posts/{communityPostId}:
    parameters:
