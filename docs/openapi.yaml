              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueUpdate'
                  links:
                    type: object
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Issues ]
      summary: Create officer update
      description: >-
        Add a new progress update for an issue. Multipart upload. Only the
        authenticated active officer currently assigned to the issue may create
        it (**403** `not_assigned_officer` otherwise). Officers without an
        active shared shift receive **403** `hub_active_required`. District
        scoping applies (**403** `officer_not_in_district`). Blocked when issue
        status is `gesloten` (**422** `issue_closed`); issues in `opgelost`
        remain writable. Up to **3** image attachments (`jpg`, `jpeg`, `png`,
        `gif`, `webp`), each at most **5 MB**. After extension rules pass,
        uploads are content-sniffed as allowed images; mismatches return **422**.
        Files are stored on non-public local storage and served only through
        authenticated download endpoints.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueUpdateCreate'
      responses:
        '201':
          description: Created update
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (see assign-self for structured codes)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notAssignedOfficer:
                  summary: Officer is not the current assignee
                  value:
                    message: Only the assigned officer may submit updates for this issue.
                    code: not_assigned_officer
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Validation failure, or issue status is `gesloten` (`issue_closed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowUnprocessableError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                issue_closed:
                  value:
                    message: Cannot create, update, or delete an officer update on a closed issue.
                    code: issue_closed

  /api/issues/{issueId}/officer-updates/{officerUpdateId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: officerUpdateId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issues ]
      summary: Update officer update
      description: >-
        Update title, content, and image attachments on an existing officer
