openapi: 3.0.3
info:
  title: WIJK App API
  description: >-
    OpenAPI 3.0 specification (Swagger UI) for the WIJK application derived from
    the provided ERD. This spec focuses on the main public/admin endpoints used
    by mobile/web clients and officer/manager consoles. It uses Bearer JWT
    authentication (adapt to Laravel Sanctum/Passport if needed).
  version: '1.0.0'
servers:
  - url: /api/v1
    description: API base path (versioned)
paths:
  /auth/register:
    post:
      tags: [ Auth ]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [ Auth ]
      summary: Current authenticated user
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /issues:
    post:
      tags: [ Issues ]
      summary: Create a new issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [ Issues ]
      summary: List issues with filters and pagination
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: status
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: district_id
          in: query
          schema:
            type: integer
        - name: lat
          in: query
          schema:
            type: number
            format: double
        - name: lng
          in: query
          schema:
            type: number
            format: double
        - name: radius
          in: query
          schema:
            type: integer
            description: radius in meters
      responses:
        '200':
          description: Paged list of issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer

  /issues/{issueId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: Get an issue by id
      responses:
        '200':
          description: Issue object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [ Issues ]
      summary: Update an issue (owner/officer/manager depending on fields)
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [ Issues ]
      summary: Soft-delete an issue
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /issues/{issueId}/comments:
    get:
      tags: [ Comments ]
      summary: List comments for an issue
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueComment'

    post:
      tags: [ Comments ]
      summary: Post a new comment on an issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCommentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueComment'

  /issues/{issueId}/messages:
    get:
      tags: [ Messages ]
      summary: Get chat messages for an issue
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueMessage'

    post:
      tags: [ Messages ]
      summary: Send a chat message in an issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMessageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMessage'

  /issues/{issueId}/attachments:
    post:
      tags: [ Attachments ]
      summary: Upload files for an issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueAttachment'

  /categories:
    get:
      tags: [ Categories ]
      summary: List categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /districts:
    get:
      tags: [ Districts ]
      summary: List districts
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/District'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    perPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 25

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    RegisterRequest:
      type: object
      required: [ username, email, password ]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        is_anonymous:
          type: boolean

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        flag_count:
          type: integer
        is_under_review:
          type: boolean
        anonymous_alias:
          type: string
        created_at:
          type: string
          format: date-time

    District:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        postal_prefix:
          type: string
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        radius_meters:
          type: integer

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        department:
          type: string
        weight:
          type: integer
        parent_id:
          type: integer

    IssueCreate:
      type: object
      required: [ category_id, title, content, department ]
      properties:
        category_id:
          type: integer
        title:
          type: string
        content:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        postal_code:
          type: string
        neighborhood:
          type: string
        department:
          type: string
          description: wijkbeheer | boa_jeugd
        is_anonymous:
          type: boolean

    IssueUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category_id:
          type: integer
        priority:
          type: string
        status:
          type: string

    Issue:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category_id:
          type: integer
        assigned_officer_id:
          type: integer
        district_id:
          type: integer
        title:
          type: string
        content:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          type: string
        priority:
          type: string
        is_flagged:
          type: boolean
        visibility:
          type: string
        anonymous_alias:
          type: string
        created_at:
          type: string
          format: date-time

    IssueCommentCreate:
      type: object
      required: [ content ]
      properties:
        content:
          type: string

    IssueComment:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        author_type:
          type: string
        user_id:
          type: integer
        officer_id:
          type: integer
        content:
          type: string
        is_flagged:
          type: boolean
        visibility:
          type: string
        created_at:
          type: string
          format: date-time

    IssueMessageCreate:
      type: object
      required: [ content ]
      properties:
        content:
          type: string

    IssueMessage:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        sender_type:
          type: string
        user_id:
          type: integer
        officer_id:
          type: integer
        content:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    IssueAttachment:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        file_url:
          type: string
        file_type:
          type: string
        uploaded_at:
          type: string
          format: date-time

    IssueParticipant:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        user_id:
          type: integer
        joined_via:
          type: string
        joined_at:
          type: string
          format: date-time

    IssueVote:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        user_id:
          type: integer
        voted_at:
          type: string
          format: date-time

