      summary: Download officer update attachment
      description: >-
        Stream an update attachment from non-public storage. Any actor who can
        view the parent issue may download (Tier B).
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
