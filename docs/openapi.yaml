  /api/issues/{issueId}/officer-updates/{officerUpdateId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: officerUpdateId
        in: path
        required: true
        schema:
          type: integer
    patch:
