          description: Uploaded attachments (flat JSON array, no data wrapper)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'openapi/schemas.yaml#/components/schemas/CommunityPostAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/community-posts/{communityPostId}/attachments/{attachmentId}:
