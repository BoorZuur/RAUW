openapi: 3.0.3
info:
  title: WIJK App API
  description: >-
    OpenAPI 3.0 specification (Swagger UI) for the WIJK application derived from
    the provided ERD. This spec focuses on the main public/admin endpoints used
    by mobile/web clients and officer/manager consoles. It uses Laravel Sanctum
    bearer token authentication for API consumers.
  version: '1.0.0'
servers:
  - url: /api/v1
    description: API base path (versioned)
paths:
  /auth/register:
    post:
      tags: [ Auth ]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/register/officer:
    post:
      tags: [ Auth ]
      summary: Register a new officer and receive a Sanctum bearer token
      description: >-
        Backend API-only officer registration. Creates an Officer record,
        immediately issues a Sanctum bearer token, and returns the same auth
        response shape and safe profile serializer used by login. This endpoint
        does not create a session and does not require authentication. Officers
        must be assigned to one or more existing departments through
        department_ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficerRegisterRequest'
            example:
              username: new-officer
              email: new.officer@example.com
              password: password123
              confirm_password: password123
              badge_number: BOA-1234
              department_ids: [1]
      responses:
        '201':
          description: Officer created and authenticated with a Sanctum bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token_type: Bearer
                access_token: 1|plain-text-sanctum-token
                actor_type: officer
                profile:
                  id: 1
                  username: new-officer
                  email: new.officer@example.com
                  badge_number: BOA-1234
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                  district: null
        '422':
          description: >-
            Validation failed. Returned when required fields are missing,
            email is invalid, password is shorter than 8 characters,
            confirm_password does not match password, department_ids is missing,
            empty, duplicated, or references unknown departments, or
            username/email/badge_number already exists in the officers table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    message: The username field is required. (and 4 more errors)
                    errors:
                      username:
                        - The username field is required.
                      email:
                        - The email field is required.
                      password:
                        - The password field is required.
                      confirm_password:
                        - The confirm password field is required.
                      badge_number:
                        - The badge number field is required.
                invalidFields:
                  summary: Invalid email, short password, and confirmation mismatch
                  value:
                    message: The email field must be a valid email address. (and 2 more errors)
                    errors:
                      email:
                        - The email field must be a valid email address.
                      password:
                        - The password field must be at least 8 characters.
                      confirm_password:
                        - The confirm password field must match password.
                duplicateIdentifiers:
                  summary: Duplicate officer identifiers
                  value:
                    message: The username has already been taken. (and 2 more errors)
                    errors:
                      username:
                        - The username has already been taken.
                      email:
                        - The email has already been taken.
                      badge_number:
                        - The badge number has already been taken.

  /auth/login:
    post:
      tags: [ Auth ]
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [ Auth ]
      summary: Current authenticated user
      description: >-
        Returns the authenticated actor_type and cleaned safe profile payload.
        This response does not issue a token. actor_type is only present at the
        top level; profile omits internal auth fields.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCurrentProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/managers:
    post:
      tags: [ Managers ]
      summary: Create a manager
      description: >-
        Create an ordinary manager as an authenticated active main manager. The
        request must include one valid department_id from the departments table;
        managers have exactly one department. The response returns the created
        manager profile only and does not issue an access token.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerCreate'
            example:
              username: new-manager
              email: new.manager@example.com
              password: password123
              confirm_password: password123
              department_id: 1
              district_id: null
      responses:
        '201':
          description: Manager created; no access token is issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /issues:
    post:
      tags: [ Issues ]
      summary: Create a new issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [ Issues ]
      summary: List issues with filters and pagination
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: status
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: district_id
          in: query
          schema:
            type: integer
        - name: lat
          in: query
          schema:
            type: number
            format: double
        - name: lng
          in: query
          schema:
            type: number
            format: double
        - name: radius
          in: query
          schema:
            type: integer
            description: radius in meters
      responses:
        '200':
          description: Paged list of issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total:
                    type: integer

  /issues/{issueId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: Get an issue by id
      responses:
        '200':
          description: Issue object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [ Issues ]
      summary: Update an issue (owner/officer/manager depending on fields)
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [ Issues ]
      summary: Soft-delete an issue
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'

  /issues/{issueId}/comments:
    get:
      tags: [ Comments ]
      summary: List comments for an issue
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueComment'

    post:
      tags: [ Comments ]
      summary: Post a new comment on an issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCommentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueComment'

  /issues/{issueId}/messages:
    get:
      tags: [ Messages ]
      summary: Get chat messages for an issue
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueMessage'

    post:
      tags: [ Messages ]
      summary: Send a chat message in an issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMessageCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMessage'

  /issues/{issueId}/attachments:
    post:
      tags: [ Attachments ]
      summary: Upload files for an issue
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueAttachment'

  /api/categories:
    get:
      tags: [ Categories ]
      summary: List categories for managers
      description: >-
        Returns main categories ordered by priority, with children ordered by
        weight. Lower numeric priority/weight values sort first and therefore
        mean higher priority. Requires an authenticated active manager.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ Categories ]
      summary: Create a category
      description: >-
        Create a main category or subcategory and assign it to one or more
        departments through the category_department pivot. Active managers may
        manage categories; main-manager status is not required. Main categories
        use priority, subcategories use weight, and lower numbers mean higher
        priority. Nested subcategories are rejected.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Categories ]
      summary: Show a category
      description: Requires an authenticated active manager.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Categories ]
      summary: Update a category
      description: >-
        Partially update a category. Include department_ids to replace the
        category's department assignments. Main categories use priority;
        subcategories use weight. Lower numbers mean higher priority.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Categories ]
      summary: Replace/update a category
      description: Same behavior and validation as PATCH /api/categories/{categoryId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Categories ]
      summary: Hard delete an eligible category
      description: >-
        Hard deletion is guarded and is not the standard removal path. Prefer
        PATCH /api/categories/{categoryId}/disable so historical issues keep
        their category context. A main category cannot be hard deleted while it
        still has subcategories. Categories referenced by existing issues also
        return a conflict.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Category hard deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/categories/{categoryId}/disable:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Categories ]
      summary: Disable a category
      description: >-
        Standard safe removal path for categories. Sets is_active to false while
        preserving the category row, department assignments, and historical issue
        references.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/departments:
    get:
      tags: [ Departments ]
      summary: List departments
      description: >-
        Returns departments from the departments table with category counts.
        Requires authentication in the protected API group.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Departments ]
      summary: Create a department
      description: >-
        Create a department row. Mutating department endpoints are restricted to
        authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/departments/{departmentId}:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Departments ]
      summary: Show a department
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Departments ]
      summary: Update a department
      description: Restricted to authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Departments ]
      summary: Replace/update a department
      description: Same behavior and validation as PATCH /api/departments/{departmentId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Departments ]
      summary: Delete a department
      description: >-
        Hard deletes the department row. Departments assigned to any manager or
        officer cannot be deleted until those actor assignments are changed.
        Once no actors reference the department, the category_department pivot
        uses database-level cascade deletes, so deleting a department
        automatically removes only its category assignments and leaves
        categories intact. Issue department migration is intentionally deferred
        to a later plan, so issue department fields may still use the legacy
        enum/string contract for now. Restricted to authenticated active main
        managers only.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Department deleted; category assignments removed automatically
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /districts:
    get:
      tags: [ Districts ]
      summary: List districts
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/District'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    perPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 25

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ConflictError:
      type: object
      properties:
        message:
          type: string
      example:
        message: Cannot delete a main category while it still has subcategories.

    RegisterRequest:
      type: object
      required: [ username, email, password ]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        is_anonymous:
          type: boolean

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ManagerCreate:
      type: object
      required: [ username, email, password, confirm_password, department_id ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique manager username. Uniqueness is checked within managers.
        email:
          type: string
          format: email
          description: Unique manager email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.
        department_id:
          type: integer
          description: Existing department ID. Managers must have exactly one department.
        district_id:
          type: integer
          nullable: true
          description: Existing district ID or null.

    Manager:
      type: object
      description: Manager resource returned by manager creation. No bearer token is issued.
      properties:
        actor_type:
          type: string
          enum: [ manager ]
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        department_id:
          type: integer
        district_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
        is_main_manager:
          type: boolean
        created_by_manager_id:
          type: integer
          nullable: true
        department:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthDepartmentProfile'
        district:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthDistrictProfile'

    OfficerRegisterRequest:
      type: object
      required: [ username, email, password, confirm_password, badge_number, department_ids ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique officer username. Uniqueness is checked within officers.
        email:
          type: string
          format: email
          description: Unique officer email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.
        badge_number:
          type: string
          maxLength: 20
          description: Unique officer badge number.
        department_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Existing department IDs. Officers must have one or more departments.
          items:
            type: integer

    AuthResponse:
      type: object
      description: >-
        Auth response wrapper. Token-issuing responses include token_type and
        access_token. The actor_type field is emitted once at the top level and
        is not duplicated inside profile.
      required: [ token_type, access_token, actor_type, profile ]
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          description: Plain-text Laravel Sanctum token. Use as Authorization: Bearer <token>.
        actor_type:
          type: string
          enum: [ user, officer, manager ]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AuthUserProfile'
            - $ref: '#/components/schemas/AuthOfficerProfile'
            - $ref: '#/components/schemas/AuthManagerProfile'

    AuthCurrentProfileResponse:
      type: object
      description: >-
        Current authenticated actor response. No token fields are included.
        actor_type is emitted once at the top level and is not duplicated inside
        profile.
      required: [ actor_type, profile ]
      properties:
        actor_type:
          type: string
          enum: [ user, officer, manager ]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AuthUserProfile'
            - $ref: '#/components/schemas/AuthOfficerProfile'
            - $ref: '#/components/schemas/AuthManagerProfile'

    AuthUserProfile:
      type: object
      description: Clean user profile payload returned in auth responses.
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        username:
          type: string
        email:
          type: string
          format: email

    AuthOfficerProfile:
      type: object
      description: Safe officer profile payload returned by login, officer registration, and current profile. Internal fields such as actor_type, district_id, and is_active are omitted.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        badge_number:
          type: string
        departments:
          type: array
          description: Compact department objects. Officers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        district:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthDistrictProfile'

    AuthManagerProfile:
      type: object
      description: Safe manager profile payload returned by login and current profile. Internal fields such as actor_type, district_id, is_active, and created_by_manager_id are omitted.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        department:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthDepartmentProfile'
        is_main_manager:
          type: boolean
        district:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthDistrictProfile'

    AuthDepartmentProfile:
      type: object
      description: Compact department data returned in actor auth/profile payloads.
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer

    AuthDistrictProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        postal_prefix:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        flag_count:
          type: integer
        is_under_review:
          type: boolean
        anonymous_alias:
          type: string
        created_at:
          type: string
          format: date-time

    District:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        postal_prefix:
          type: string
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        radius_meters:
          type: integer

    Category:
      type: object
      description: >-
        Category resource. Categories are assigned to departments through the
        category_department many-to-many pivot. Main categories have parent_id
        null and use priority for ordering. Subcategories reference a main
        category through parent_id and use weight for ordering. For both fields,
        lower numbers mean higher priority and sort first.
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        parent_id:
          type: integer
          nullable: true
        is_main_category:
          type: boolean
        priority:
          type: integer
          nullable: true
          description: Main-category ordering value; lower number means higher priority.
        weight:
          type: integer
          nullable: true
          description: Subcategory ordering value; lower number means higher priority.
        parent:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryParentSummary'
        departments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DepartmentSummary'
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryParentSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    DepartmentSummary:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer
        is_active:
          type: boolean

    CategoryDepartmentAssignment:
      type: object
      description: Pivot assignment between a category and a department.
      properties:
        category_id:
          type: integer
        department_id:
          type: integer

    CategoryCreate:
      type: object
      required: [ name, department_ids ]
      properties:
        name:
          type: string
          maxLength: 100
        parent_id:
          type: integer
          nullable: true
          description: Null for main categories; subcategories must reference an active main category.
        department_ids:
          type: array
          minItems: 1
          description: Existing department ids to attach through the category_department pivot.
          items:
            type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Main categories only; lower number means higher priority.
        weight:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Subcategories only; lower number means higher priority.
        is_active:
          type: boolean
          default: true

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        parent_id:
          type: integer
          nullable: true
        department_ids:
          type: array
          minItems: 1
          description: When present, replaces the category's department assignments.
          items:
            type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Main categories only; lower number means higher priority.
        weight:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Subcategories only; lower number means higher priority.
        is_active:
          type: boolean

    Department:
      type: object
      description: >-
        Department table row. Categories are assigned to one or more departments
        through category_department. Managers reference exactly one department
        through department_id. Officers reference one or more departments
        through department_officer. Deleting a department is blocked while it is
        assigned to managers or officers; otherwise it cascades only category
        pivot assignments and does not delete category rows. Issue department
        migration is deferred to a later plan, so issues may still expose the
        legacy enum/string department field.
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer
        is_active:
          type: boolean
        categories_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DepartmentCreate:
      type: object
      required: [ code, name ]
      properties:
        code:
          type: string
          maxLength: 50
          description: Stable unique department code.
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          default: true

    DepartmentUpdate:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: Stable unique department code.
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean

    IssueCreate:
      type: object
      required: [ category_id, title, content, department ]
      properties:
        category_id:
          type: integer
        title:
          type: string
        content:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        address:
          type: string
        postal_code:
          type: string
        neighborhood:
          type: string
        department:
          type: string
          description: wijkbeheer | boa_jeugd
        is_anonymous:
          type: boolean

    IssueUpdate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        category_id:
          type: integer
        priority:
          type: string
        status:
          type: string

    Issue:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        category_id:
          type: integer
        assigned_officer_id:
          type: integer
        district_id:
          type: integer
        title:
          type: string
        content:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        status:
          type: string
        priority:
          type: string
        is_flagged:
          type: boolean
        visibility:
          type: string
        anonymous_alias:
          type: string
        created_at:
          type: string
          format: date-time

    IssueCommentCreate:
      type: object
      required: [ content ]
      properties:
        content:
          type: string

    IssueComment:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        author_type:
          type: string
        user_id:
          type: integer
        officer_id:
          type: integer
        content:
          type: string
        is_flagged:
          type: boolean
        visibility:
          type: string
        created_at:
          type: string
          format: date-time

    IssueMessageCreate:
      type: object
      required: [ content ]
      properties:
        content:
          type: string

    IssueMessage:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        sender_type:
          type: string
        user_id:
          type: integer
        officer_id:
          type: integer
        content:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    IssueAttachment:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        file_url:
          type: string
        file_type:
          type: string
        uploaded_at:
          type: string
          format: date-time

    IssueParticipant:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        user_id:
          type: integer
        joined_via:
          type: string
        joined_at:
          type: string
          format: date-time

    IssueVote:
      type: object
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        user_id:
          type: integer
        voted_at:
          type: string
          format: date-time

