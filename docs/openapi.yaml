        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/ManagerCreate'
            example:
              username: new-manager
              email: new.manager@example.com
              password: password123
              confirm_password: password123
              department_ids: [1]
              district_ids: [1]
      responses:
        '201':
          description: Manager created; no access token is issued
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Manager'
              example:
                actor_type: manager
                id: 2
                username: new-manager
                email: new.manager@example.com
                is_active: true
                is_main_manager: false
                created_by_manager_id: 1
                departments:
                  - id: 1
                    code: wijkbeheer
                    name: Wijkbeheer
                districts:
                  - id: 1
                    name: Cool
                    postal_prefix: '3012'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

