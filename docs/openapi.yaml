    post:
      tags: [ Community Posts, Attachments ]
      summary: Upload community post attachments
      description: >-
        Upload 1–5 attachments to a community post. Each post may hold at most 5
        attachments total; each file is limited to 5 MB. Restricted to the
        authoring officer or officers assigned to the post's district. Requires
        hub-active shift (Tier C). Files are stored on the non-public local disk
