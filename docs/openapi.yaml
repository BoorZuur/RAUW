openapi: 3.0.3
info:
  title: WIJK App API
  description: >-
    OpenAPI 3.0 specification (Swagger UI) for the WIJK application derived from
    the provided ERD. This spec focuses on the main public/admin endpoints used
    by mobile/web clients and officer/manager consoles. It uses Laravel Sanctum
    bearer token authentication for API consumers.
  version: '1.0.0'
servers:
  - url: /
    description: Backend host root; API routes are prefixed with /api.
paths:
  /api/auth/register/officer:
    post:
      tags: [ Auth ]
      summary: Register a new officer and receive a Sanctum bearer token
      description: >-
        Backend API-only officer registration. Creates an Officer record,
        immediately issues a Sanctum bearer token, and returns the same auth
        response shape and safe profile serializer used by login. This endpoint
        does not create a session and does not require authentication. Officers
        must be assigned to one or more existing departments through
        department_ids. Optional district assignments use district_ids and are
        stored through the district_officer pivot; officers may also start with
        no assigned districts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficerRegisterRequest'
            example:
              username: new-officer
              email: new.officer@example.com
              password: password123
              confirm_password: password123
              badge_number: BOA-1234
              department_ids: [1]
              district_ids: [1]
      responses:
        '201':
          description: Officer created and authenticated with a Sanctum bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token_type: Bearer
                access_token: 1|plain-text-sanctum-token
                actor_type: officer
                profile:
                  id: 1
                  username: new-officer
                  email: new.officer@example.com
                  badge_number: BOA-1234
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                  districts:
                    - id: 1
                      name: Middelharnis
                      postal_prefix: '3241'
        '422':
          description: >-
            Validation failed. Returned when required fields are missing,
            email is invalid, password is shorter than 8 characters,
            confirm_password does not match password, department_ids is missing,
            empty, duplicated, or references unknown departments, or
            district_ids is duplicated or references inactive/unknown districts,
            or username/email/badge_number already exists in the officers table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    message: The username field is required. (and 4 more errors)
                    errors:
                      username:
                        - The username field is required.
                      email:
                        - The email field is required.
                      password:
                        - The password field is required.
                      confirm_password:
                        - The confirm password field is required.
                      badge_number:
                        - The badge number field is required.
                invalidFields:
                  summary: Invalid email, short password, and confirmation mismatch
                  value:
                    message: The email field must be a valid email address. (and 2 more errors)
                    errors:
                      email:
                        - The email field must be a valid email address.
                      password:
                        - The password field must be at least 8 characters.
                      confirm_password:
                        - The confirm password field must match password.
                duplicateIdentifiers:
                  summary: Duplicate officer identifiers
                  value:
                    message: The username has already been taken. (and 2 more errors)
                    errors:
                      username:
                        - The username has already been taken.
                      email:
                        - The email has already been taken.
                      badge_number:
                        - The badge number has already been taken.

  /api/auth/register/user:
    post:
      tags: [ Auth ]
      summary: Register a new user and receive a Sanctum bearer token
      description: >-
        Backend API-only public user registration. Creates a User record,
        immediately issues a Sanctum bearer token, and returns the same auth
        response shape and safe profile serializer used by login. This endpoint
        does not create a session and does not require authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
            example:
              username: new-user
              email: new.user@example.com
              password: password123
              confirm_password: password123
      responses:
        '201':
          description: User created and authenticated with a Sanctum bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                token_type: Bearer
                access_token: 1|plain-text-sanctum-token
                actor_type: user
                profile:
                  id: 1
                  username: new-user
                  email: new.user@example.com
        '422':
          description: >-
            Validation failed. Returned when required fields are missing,
            email is invalid, password is shorter than 8 characters,
            confirm_password does not match password, or username already exists
            in the users table, or email already exists for any user, officer,
            or manager.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    message: The username field is required. (and 3 more errors)
                    errors:
                      username:
                        - The username field is required.
                      email:
                        - The email field is required.
                      password:
                        - The password field is required.
                      confirm_password:
                        - The confirm password field is required.
                invalidFields:
                  summary: Invalid email, short password, and confirmation mismatch
                  value:
                    message: The email field must be a valid email address. (and 2 more errors)
                    errors:
                      email:
                        - The email field must be a valid email address.
                      password:
                        - The password field must be at least 8 characters.
                      confirm_password:
                        - The confirm password field must match password.
                duplicateIdentifiers:
                  summary: Duplicate user identifiers
                  value:
                    message: The username has already been taken. (and 1 more error)
                    errors:
                      username:
                        - The username has already been taken.
                      email:
                        - The email has already been taken.

  /api/auth/login:
    post:
      tags: [ Auth ]
      summary: Login and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                managerLogin:
                  summary: Manager login profile
                  value:
                    token_type: Bearer
                    access_token: 1|plain-text-sanctum-token
                    actor_type: manager
                    profile:
                      id: 1
                      username: demo-manager
                      email: demo.manager@example.com
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      is_main_manager: true
                      districts:
                        - id: 1
                          name: Middelharnis
                          postal_prefix: '3241'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [ Auth ]
      summary: Current authenticated user
      description: >-
        Returns the authenticated actor_type and cleaned safe profile payload.
        This response does not issue a token. actor_type is only present at the
        top level; profile omits internal auth fields.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCurrentProfileResponse'
              examples:
                managerProfile:
                  summary: Current manager profile
                  value:
                    actor_type: manager
                    profile:
                      id: 1
                      username: demo-manager
                      email: demo.manager@example.com
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      is_main_manager: true
                      districts:
                        - id: 1
                          name: Middelharnis
                          postal_prefix: '3241'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [ Auth ]
      summary: Update my profile identity fields
      description: >-
        Self-service identity update for active users, officers, and managers.
        Accepts a partial PATCH body: send only the fields to change. Users and
        managers may update username, email, and password; officers may also
        update badge_number. When password is present, confirm_password must
        match. Department, district, and privileged fields are rejected with
        422 validation errors and must not be sent on this path.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthProfileUpdate'
            examples:
              emailOnly:
                summary: Change email only
                value:
                  email: new.email@example.com
              passwordChange:
                summary: Change password
                value:
                  password: newpassword123
                  confirm_password: newpassword123
              officerBadge:
                summary: Officer badge number update
                value:
                  badge_number: BOA-0042
      responses:
        '200':
          description: Refreshed actor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCurrentProfileResponse'
              examples:
                userProfile:
                  summary: Updated user profile
                  value:
                    actor_type: user
                    profile:
                      id: 1
                      username: demo-user
                      email: new.email@example.com
                officerProfile:
                  summary: Updated officer profile
                  value:
                    actor_type: officer
                    profile:
                      id: 1
                      username: demo-officer
                      email: demo.officer@example.com
                      badge_number: BOA-0042
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      districts:
                        - id: 1
                          name: Middelharnis
                          postal_prefix: '3241'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/logout:
    post:
      tags: [ Auth ]
      summary: Logout and revoke current bearer token
      description: >-
        Revokes only the Sanctum bearer token used for the current request.
        Other tokens issued to the same actor remain valid until explicitly
        revoked or expired.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                required: [ message ]
                properties:
                  message:
                    type: string
                    example: Logged out.
              example:
                message: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/districts:
    patch:
      tags: [ Managers, Officers ]
      summary: Update my district assignments
      description: >-
        Self-service district assignment endpoint for active managers and active
        officers. Replaces the authenticated actor's district assignments with
        the supplied district_ids array and returns the refreshed auth profile.
        Users receive 403 because they do not have district assignments. The
        request updates only actor district pivots and never modifies the
        singular issues.district_id issue location/reference field.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictAssignmentUpdate'
            example:
              district_ids: [1, 2]
      responses:
        '200':
          description: Refreshed manager or officer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCurrentProfileResponse'
              examples:
                managerProfile:
                  summary: Implemented manager self-service response
                  value:
                    actor_type: manager
                    profile:
                      id: 1
                      username: demo-manager
                      email: demo.manager@example.com
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      is_main_manager: true
                      districts:
                        - id: 1
                          name: Middelharnis
                          postal_prefix: '3241'
                        - id: 2
                          name: Sommelsdijk
                          postal_prefix: '3245'
                officerProfile:
                  summary: Implemented officer self-service response
                  value:
                    actor_type: officer
                    profile:
                      id: 1
                      username: demo-officer
                      email: demo.officer@example.com
                      badge_number: BOA-0001
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      districts:
                        - id: 1
                          name: Middelharnis
                          postal_prefix: '3241'
                        - id: 2
                          name: Sommelsdijk
                          postal_prefix: '3245'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/managers:
    post:
      tags: [ Managers ]
      summary: Create a manager
      description: >-
        Create an ordinary manager as an authenticated active main manager. The
        request must include department_ids with at least one valid department
        from the departments table. Optional district_ids assign the manager to
        one or more active districts through the district_manager pivot. The
        response returns the created manager profile only and does not issue an
        access token.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerCreate'
            example:
              username: new-manager
              email: new.manager@example.com
              password: password123
              confirm_password: password123
              department_ids: [1]
              district_ids: [1]
      responses:
        '201':
          description: Manager created; no access token is issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
              example:
                actor_type: manager
                id: 2
                username: new-manager
                email: new.manager@example.com
                is_active: true
                is_main_manager: false
                created_by_manager_id: 1
                departments:
                  - id: 1
                    code: wijkbeheer
                    name: Wijkbeheer
                districts:
                  - id: 1
                    name: Middelharnis
                    postal_prefix: '3241'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/managers/{managerId}/departments:
    parameters:
      - name: managerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Managers ]
      summary: Update a manager's department assignments
      description: >-
        Main-manager-only department assignment endpoint. Replaces the target manager's department
        assignments with the supplied department_ids array and returns that
        manager's refreshed Manager resource. Only an authenticated active main
        manager (is_main_manager=true) may call this endpoint. Users, officers,
        ordinary managers, inactive managers, inactive main managers, and
        unauthenticated requests receive 403. The endpoint updates only the
        department_manager pivot. department_ids must be present and may be an
        empty array to clear all assignments; unlike manager creation, PATCH does
        not require at least one department. Unknown department IDs and duplicates
        return 422. Soft-deleted managers return 404.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentAssignmentUpdate'
            examples:
              assignDepartments:
                summary: Replace with two departments
                value:
                  department_ids: [1, 2]
              clearDepartments:
                summary: Clear all department assignments
                value:
                  department_ids: []
      responses:
        '200':
          description: Refreshed manager profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
              example:
                actor_type: manager
                id: 2
                username: new-manager
                email: new.manager@example.com
                is_active: true
                is_main_manager: false
                created_by_manager_id: 1
                departments:
                  - id: 1
                    code: wijkbeheer
                    name: Wijkbeheer
                  - id: 2
                    code: boa_jeugd
                    name: BOA Jeugd
                districts:
                  - id: 1
                    name: Middelharnis
                    postal_prefix: '3241'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/{officerId}/districts:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Managers ]
      summary: Update an officer's district assignments
      description: >-
        Manager-admin district assignment endpoint. Replaces the target officer's
        district assignments with the supplied district_ids array and returns that
        officer's refreshed profile. Only an authenticated active manager may
        call this endpoint. Users, officers, inactive managers, and unauthenticated
        requests cannot update officer districts. The endpoint updates only the
        district_officer pivot and never modifies issues.district_id.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictAssignmentUpdate'
            example:
              district_ids: [1, 2]
      responses:
        '200':
          description: Refreshed officer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCurrentProfileResponse'
              example:
                actor_type: officer
                profile:
                  id: 1
                  username: demo-officer
                  email: demo.officer@example.com
                  badge_number: BOA-0001
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                  districts:
                    - id: 1
                      name: Middelharnis
                      postal_prefix: '3241'
                    - id: 2
                      name: Sommelsdijk
                      postal_prefix: '3245'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/{officerId}/departments:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Managers ]
      summary: Update an officer's department assignments
      description: >-
        Main-manager-only department assignment endpoint. Replaces the target officer's department
        assignments with the supplied department_ids array and returns that
        officer's refreshed auth profile. Only an authenticated active main manager
        (is_main_manager=true) may call this endpoint. Users, officers, ordinary
        managers, inactive managers, inactive main managers, and unauthenticated
        requests receive 403. This differs from PATCH /api/officers/{officerId}/districts,
        which any authenticated active manager may call. The endpoint updates only
        the department_officer pivot. department_ids must be present and may be an
        empty array to clear all assignments; unlike officer registration, PATCH
        does not require at least one department. Unknown department IDs and
        duplicates return 422. Soft-deleted officers return 404.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentAssignmentUpdate'
            examples:
              assignDepartments:
                summary: Replace with two departments
                value:
                  department_ids: [1, 2]
              clearDepartments:
                summary: Clear all department assignments
                value:
                  department_ids: []
      responses:
        '200':
          description: Refreshed officer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCurrentProfileResponse'
              example:
                actor_type: officer
                profile:
                  id: 1
                  username: demo-officer
                  email: demo.officer@example.com
                  badge_number: BOA-0001
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                    - id: 2
                      code: boa_jeugd
                      name: BOA Jeugd
                  districts:
                    - id: 1
                      name: Middelharnis
                      postal_prefix: '3241'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues:
    post:
      tags: [ Issues ]
      summary: Create a new issue
      description: >-
        Create an issue as an authenticated active user. The request requires
        category_id, district_id, title, and content. The issue's departments are
        derived server-side from the selected category's department assignments,
        synced to the department_issue pivot, and returned as a read-only
        departments array. Clients must not send department values. The database
        no longer stores issues.department; pivot rows are the only persistence.
        Location
        fields are optional. When is_anonymous is true the backend still stores
        user_id ownership, but generates and persists a stable anonymous alias
        such as Melder#A1B2C3D4 for public display; clients cannot submit the
        alias. The integer priority is derived server-side from the selected
        category's main-category priority (lower number = higher urgency) and
        must not be sent in the request body.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreate'
            example:
              title: Losliggende stoeptegel
              content: Er ligt een stoeptegel los bij de bushalte.
              category_id: 1
              district_id: 1
              postal_code: '3241AB'
              address: Voorstraat 1, Middelharnis
              latitude: 51.75750000
              longitude: 4.16500000
              is_anonymous: true
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [ Issues ]
      summary: List issues with filters and pagination
      description: >-
        List issues for any authenticated actor. Filters are optional and
        composable: district_id, department, and category_id may be combined in a
        single request to narrow the result set. Query param department accepts a
        department code from the departments table and matches through
        department_issue with any-match semantics, so a multi-department issue is
        included when any pivot assignment has the requested code. Pagination is
        backend-driven using page and per_page,
        with a default per_page of 20 and maximum of 100. Results are ordered
        newest first.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: department
          in: query
          description: >-
            Optional composable department filter. Must be an existing department
            code and matches issues where any assigned department has this code.
          schema:
            type: string
            example: wijkbeheer
        - name: category_id
          in: query
          description: Optional composable category filter.
          schema:
            type: integer
        - name: district_id
          in: query
          description: Optional composable district filter.
          schema:
            type: integer
      responses:
        '200':
          description: Backend-paginated list of issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: Get an issue by id
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Issue object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [ Issues ]
      summary: Replace/update own issue
      description: Same partial-update behavior and validation as PATCH /api/issues/{issueId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
            example:
              title: Stoeptegel bij bushalte bijgewerkt
              content: De tegel ligt nu volledig los.
              category_id: 1
              district_id: 1
              is_anonymous: false
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [ Issues ]
      summary: Update own issue
      description: >-
        Partially update an issue owned by the authenticated active user. The
        owner is checked through issues.user_id, including for anonymous issues.
        Clients may update title, content, category_id, district_id, optional
        location fields, and is_anonymous. When category_id changes, departments
        and integer priority are re-derived from the selected category's
        main-category priority and returned as read-only fields. user_id, status,
        priority, counters, department assignments, and anonymous_alias are
        server-owned; clients must not send priority.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
            example:
              title: Stoeptegel bij bushalte bijgewerkt
              content: De tegel ligt nu volledig los.
              category_id: 1
              district_id: 1
              is_anonymous: false
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [ Issues ]
      summary: Hard delete own issue
      description: >-
        Hard delete an issue owned by the authenticated active user. This is not
        a soft delete. The issue row is removed outright and issue attachments
        cascade with the issue through the database foreign key.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Issue hard deleted; attachments cascaded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/attachments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Attachments ]
      summary: Upload files for an issue
      description: >-
        Upload attachments to an issue owned by the authenticated active user.
        Each issue may hold at most 5 attachments in total. Each uploaded file is
        limited to 5 MB and must be jpg, jpeg, png, gif, webp, or pdf. In local
        development files are stored on the non-public local disk and are served
        only through the authenticated download endpoint; no public storage URL
        is exposed. To replace files while editing an issue, delete existing
        attachments first, then upload new files within the same total limit.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ files ]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded attachments
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/attachments/{attachmentId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [ Attachments ]
      summary: Delete an issue attachment
      description: >-
        Hard delete one attachment from an issue owned by the authenticated active
        user. Officers, managers, inactive users, unauthenticated requests, and
        non-owner users receive 403. The attachment must belong to the issue in
        the route; otherwise the backend returns 404. Deletion removes the backing
        file from non-public local storage when present and deletes the attachment
        row, enabling replace workflows before uploading new files.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Attachment hard deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/attachments/{attachmentId}/download:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Attachments ]
      summary: Download an issue attachment
      description: >-
        Stream an attachment from non-public local development storage. Allowed for
        the authenticated active user who owns the issue, any active officer, or
        any active manager. Non-owner users, inactive actors, and unauthenticated
        requests receive 403. The attachment must belong to the issue in the route
        and the backing local file must still exist; otherwise the backend returns
        404.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/categories:
    get:
      tags: [ Categories ]
      summary: List categories
      description: >-
        Returns main categories ordered by priority, with children ordered by
        weight. Lower numeric priority/weight values sort first and therefore
        mean higher priority. Any authenticated Sanctum actor (User, Officer, or
        Manager) may call this endpoint.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Categories ]
      summary: Create a category
      description: >-
        Create a main category or subcategory and assign it to one or more
        departments through the category_department pivot. Active managers may
        manage categories; main-manager status is not required. Main categories
        use priority, subcategories use weight, and lower numbers mean higher
        priority. Nested subcategories are rejected.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Categories ]
      summary: Show a category
      description: >-
        Returns a single category with departments, parent, and children. Any
        authenticated Sanctum actor (User, Officer, or Manager) may call this
        endpoint.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Categories ]
      summary: Update a category
      description: >-
        Partially update a category. Include department_ids to replace the
        category's department assignments. Main categories use priority;
        subcategories use weight. Lower numbers mean higher priority.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Categories ]
      summary: Replace/update a category
      description: Same behavior and validation as PATCH /api/categories/{categoryId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Categories ]
      summary: Hard delete an eligible category
      description: >-
        Only authenticated active managers may hard delete categories. Hard
        deletion is guarded and is not the standard removal path. Prefer PATCH
        /api/categories/{categoryId}/disable so historical issues keep their
        category context. A main category cannot be hard deleted while it still
        has subcategories. Categories referenced by existing issues also return
        a conflict.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Category hard deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/categories/{categoryId}/disable:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Categories ]
      summary: Disable a category
      description: >-
        Only authenticated active managers may disable categories. Standard safe
        removal path for categories. Sets is_active to false while preserving
        the category row, department assignments, and historical issue
        references.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/departments:
    get:
      tags: [ Departments ]
      summary: List departments
      description: >-
        Returns departments from the departments table with category counts.
        Requires authentication in the protected API group.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Departments ]
      summary: Create a department
      description: >-
        Create a department row. Mutating department endpoints are restricted to
        authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/departments/{departmentId}:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Departments ]
      summary: Show a department
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Departments ]
      summary: Update a department
      description: Restricted to authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Departments ]
      summary: Replace/update a department
      description: Same behavior and validation as PATCH /api/departments/{departmentId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Departments ]
      summary: Delete a department
      description: >-
        Hard deletes the department row. Departments assigned to any manager or
        officer cannot be deleted until those actor assignments are changed.
        Once no actors reference the department, the category_department pivot
        uses database-level cascade deletes, and department_issue cascades the
        issue pivot assignments, so deleting a department removes only those
        assignments while leaving categories and issue rows intact. Issue
        responses expose derived read-only departments as an array. Restricted to
        authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Department deleted; category and issue pivot assignments removed automatically
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/districts:
    get:
      tags: [ Districts ]
      summary: List districts
      description: >-
        List districts ordered by name, including manager/officer assignment
        counts and issue reference counts when available. Requires
        authentication in the protected API group. District records are separate
        from actor assignments: managers and officers are assigned through
        district_manager and district_officer pivots, while issues.district_id
        remains a singular issue location/reference field.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Districts ]
      summary: Create a district
      description: >-
        Create a district row. Only authenticated active managers may create,
        update, or delete districts. District CRUD manages district records only;
        actor assignments use district_ids endpoints and issue district
        references are not reassigned.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictCreate'
            example:
              name: Nieuwe Wijk
              postal_prefix: '3248'
              center_lat: 51.75000000
              center_lng: 4.16000000
              radius_meters: 2500
              is_active: true
      responses:
        '201':
          description: District created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/districts/{districtId}:
    parameters:
      - name: districtId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Districts ]
      summary: Show a district
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: District resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Districts ]
      summary: Update a district
      description: Only authenticated active managers may update districts.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictUpdate'
            example:
              name: Nieuwe Wijk bijgewerkt
              is_active: true
      responses:
        '200':
          description: District updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Districts ]
      summary: Replace/update a district
      description: Same behavior and validation as PATCH /api/districts/{districtId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictUpdate'
      responses:
        '200':
          description: District updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Districts ]
      summary: Delete an eligible district
      description: >-
        Only authenticated active managers may delete districts. Deletion returns
        409 Conflict when the district is still assigned to any manager, assigned
        to any officer, or referenced by any issue through issues.district_id.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: District deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    perPage:
      name: per_page
      in: query
      description: Backend-driven page size. Defaults to 20 and is capped at 100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictError:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ConflictError:
      type: object
      properties:
        message:
          type: string
      example:
        message: Cannot delete a main category while it still has subcategories.

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ManagerCreate:
      type: object
      required: [ username, email, password, confirm_password, department_ids ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique manager username. Uniqueness is checked within managers.
        email:
          type: string
          format: email
          description: Unique manager email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.
        department_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Existing department IDs. Managers must have one or more departments.
          items:
            type: integer
        district_ids:
          type: array
          uniqueItems: true
          description: Optional active district IDs to attach through the district_manager pivot.
          items:
            type: integer

    Manager:
      type: object
      description: Manager resource returned by manager creation. No bearer token is issued.
      properties:
        actor_type:
          type: string
          enum: [ manager ]
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        is_main_manager:
          type: boolean
        created_by_manager_id:
          type: integer
          nullable: true
        departments:
          type: array
          description: Compact department objects. Managers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        districts:
          type: array
          description: Compact district objects assigned through the district_manager pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    OfficerRegisterRequest:
      type: object
      required: [ username, email, password, confirm_password, badge_number, department_ids ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique officer username. Uniqueness is checked within officers.
        email:
          type: string
          format: email
          description: Unique officer email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.
        badge_number:
          type: string
          maxLength: 20
          description: Unique officer badge number.
        department_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Existing department IDs. Officers must have one or more departments.
          items:
            type: integer
        district_ids:
          type: array
          uniqueItems: true
          description: Optional active district IDs to attach through the district_officer pivot.
          items:
            type: integer

    UserRegisterRequest:
      type: object
      required: [ username, email, password, confirm_password ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique user username. Uniqueness is checked within users.
        email:
          type: string
          format: email
          description: Unique user email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.

    AuthProfileUpdate:
      type: object
      description: >-
        Partial self-service identity update. All fields are optional; send only
        fields to change. Officers may include badge_number; users and managers
        must not send badge_number (422). When password is present,
        confirm_password is required and must match. Department, district, and
        privileged fields are not accepted on this path.
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique username within the authenticated actor's table.
        email:
          type: string
          format: email
          description: Unique email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Required when password is present; must exactly match password.
        badge_number:
          type: string
          maxLength: 20
          description: Officers only. Unique officer badge number.

    AuthResponse:
      type: object
      description: >-
        Auth response wrapper. Token-issuing responses include token_type and
        access_token. The actor_type field is emitted once at the top level and
        is not duplicated inside profile.
      required: [ token_type, access_token, actor_type, profile ]
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          description: >-
            Plain-text Laravel Sanctum token. Use as Authorization Bearer header
            value (format `Bearer <token>`).
        actor_type:
          type: string
          enum: [ user, officer, manager ]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AuthUserProfile'
            - $ref: '#/components/schemas/AuthOfficerProfile'
            - $ref: '#/components/schemas/AuthManagerProfile'

    AuthCurrentProfileResponse:
      type: object
      description: >-
        Current authenticated actor response. No token fields are included.
        actor_type is emitted once at the top level and is not duplicated inside
        profile.
      required: [ actor_type, profile ]
      properties:
        actor_type:
          type: string
          enum: [ user, officer, manager ]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AuthUserProfile'
            - $ref: '#/components/schemas/AuthOfficerProfile'
            - $ref: '#/components/schemas/AuthManagerProfile'

    AuthUserProfile:
      type: object
      description: Clean user profile payload returned in auth responses.
      required: [ id, username, email ]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email

    AuthOfficerProfile:
      type: object
      description: Safe officer profile payload returned by login, officer registration, and current profile. Internal fields such as actor_type, district_id, and is_active are omitted.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        badge_number:
          type: string
        departments:
          type: array
          description: Compact department objects. Officers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        districts:
          type: array
          description: Compact district objects assigned through the district_officer pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    AuthManagerProfile:
      type: object
      description: Safe manager profile payload returned by login and current profile. Internal fields such as actor_type, district_id, is_active, and created_by_manager_id are omitted.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        departments:
          type: array
          description: Compact department objects. Managers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        is_main_manager:
          type: boolean
        districts:
          type: array
          description: Compact district objects assigned through the district_manager pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    AuthDepartmentProfile:
      type: object
      description: Compact department data returned in actor auth/profile payloads.
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer

    AuthDistrictProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        postal_prefix:
          type: string

    District:
      type: object
      description: >-
        District record. Managers and officers are assigned to districts through
        district_manager and district_officer many-to-many pivots. The
        issues.district_id field remains a singular issue location/reference and
        is not changed by actor district assignment endpoints.
      properties:
        id:
          type: integer
        name:
          type: string
        postal_prefix:
          type: string
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        radius_meters:
          type: integer
          nullable: true
        is_active:
          type: boolean
        managers_count:
          type: integer
          nullable: true
        officers_count:
          type: integer
          nullable: true
        issues_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DistrictCreate:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          maxLength: 100
        postal_prefix:
          type: string
          maxLength: 10
          nullable: true
        center_lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        center_lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        radius_meters:
          type: integer
          minimum: 1
          nullable: true
        is_active:
          type: boolean
          default: true

    DistrictUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        postal_prefix:
          type: string
          maxLength: 10
          nullable: true
        center_lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        center_lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        radius_meters:
          type: integer
          minimum: 1
          nullable: true
        is_active:
          type: boolean

    DistrictAssignmentUpdate:
      type: object
      required: [ district_ids ]
      properties:
        district_ids:
          type: array
          uniqueItems: true
          description: >-
            Full replacement set of active district IDs. Use an empty array to
            clear all actor district assignments. Duplicate IDs and inactive or
            unknown districts return validation errors.
          items:
            type: integer

    DepartmentAssignmentUpdate:
      type: object
      required: [ department_ids ]
      properties:
        department_ids:
          type: array
          uniqueItems: true
          description: >-
            Full replacement set of department IDs from the departments table.
            The key must be present. Use an empty array to clear all actor
            department assignments (valid for PATCH; differs from create/register
            flows that require at least one department). Duplicate IDs and
            unknown department IDs return validation errors. Department active
            status is not filtered on assignment (matches create/register).
          items:
            type: integer

    Category:
      type: object
      description: >-
        Category resource. Categories are assigned to departments through the
        category_department many-to-many pivot. Main categories have parent_id
        null and use priority for ordering. Subcategories reference a main
        category through parent_id and use weight for ordering. For both fields,
        lower numbers mean higher priority and sort first.
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        parent_id:
          type: integer
          nullable: true
        is_main_category:
          type: boolean
        priority:
          type: integer
          nullable: true
          description: Main-category ordering value; lower number means higher priority.
        weight:
          type: integer
          nullable: true
          description: Subcategory ordering value; lower number means higher priority.
        parent:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryParentSummary'
        departments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DepartmentSummary'
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryParentSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    DepartmentSummary:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer
        is_active:
          type: boolean

    CategoryDepartmentAssignment:
      type: object
      description: Pivot assignment between a category and a department.
      properties:
        category_id:
          type: integer
        department_id:
          type: integer

    CategoryCreate:
      type: object
      required: [ name, department_ids ]
      properties:
        name:
          type: string
          maxLength: 100
        parent_id:
          type: integer
          nullable: true
          description: Null for main categories; subcategories must reference an active main category.
        department_ids:
          type: array
          minItems: 1
          description: Existing department ids to attach through the category_department pivot.
          items:
            type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Main categories only; lower number means higher priority.
        weight:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Subcategories only; lower number means higher priority.
        is_active:
          type: boolean
          default: true

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        parent_id:
          type: integer
          nullable: true
        department_ids:
          type: array
          minItems: 1
          description: When present, replaces the category's department assignments.
          items:
            type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Main categories only; lower number means higher priority.
        weight:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Subcategories only; lower number means higher priority.
        is_active:
          type: boolean

    Department:
      type: object
      description: >-
        Department table row. Categories are assigned to one or more departments
        through category_department. Managers reference one or more departments
        through department_manager. Officers reference one or more departments
        through department_officer. Deleting a department is blocked while it is
        assigned to managers or officers; otherwise it cascades only category
        and issue pivot assignments and does not delete category or issue rows.
        Issue departments are derived from categories, stored through the
        department_issue pivot, and exposed to clients as read-only arrays.
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer
        is_active:
          type: boolean
        categories_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DepartmentCreate:
      type: object
      required: [ code, name ]
      properties:
        code:
          type: string
          maxLength: 50
          description: Stable unique department code.
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          default: true

    DepartmentUpdate:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: Stable unique department code.
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean

    IssueCreate:
      type: object
      description: >-
        Client payload for creating an issue. district_id is required and must
        reference an active district. Departments are derived server-side from
        the selected category's department assignments and are not accepted in
        the request. The integer priority is derived server-side from the
        selected category's main-category priority and must not be sent.
        Removed legacy locality fields are not accepted. Anonymous aliases are
        generated server-side; anonymous issues remain owned by the authenticated
        user via user_id.
      required: [ title, content, category_id, district_id ]
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        category_id:
          type: integer
        district_id:
          type: integer
          description: Required active district ID for the issue location/reference.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        address:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        is_anonymous:
          type: boolean
          default: false

    IssueUpdate:
      type: object
      description: >-
        Owner-editable issue fields. All fields are optional for PATCH/PUT and
        only supplied fields are changed. user_id, status, priority,
        anonymous_alias, department assignments, and counters are server-owned;
        priority must not be sent. When category_id is supplied, departments and
        integer priority are re-derived from that category's main-category
        priority. The public API no longer accepts removed legacy locality fields
        or client-supplied department values.
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        category_id:
          type: integer
        district_id:
          type: integer
        postal_code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        is_anonymous:
          type: boolean

    Issue:
      type: object
      description: >-
        Issue resource. Anonymous issues remain user-owned in the database
        through user_id, but the response exposes only an author display alias
        such as Melder#A1B2C3D4 and never leaks the owning user's id. Non-anonymous
        issues include author identity when loaded. Attachments include
        authenticated download URLs only. Department assignments are stored in
        department_issue, derived from the issue category, and exposed as a
        read-only departments array only (no singular department property on
        requests or responses).
      properties:
        id:
          type: integer
        category_id:
          type: integer
        district_id:
          type: integer
        title:
          type: string
        content:
          type: string
        postal_code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        departments:
          type: array
          nullable: true
          description: >-
            Read-only compact departments assigned to the issue through the
            department_issue pivot. Derived from the selected category on create
            and whenever category_id changes.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        status:
          type: string
        priority:
          type: integer
          nullable: true
          description: >-
            Server-derived integer priority copied from the issue category's
            main-category priority on create and whenever category_id changes.
            Lower number means higher urgency; same scale as categories.priority.
        is_anonymous:
          type: boolean
        author:
          $ref: '#/components/schemas/IssueAuthor'
        vote_count:
          type: integer
        participant_count:
          type: integer
        duplicate_count:
          type: integer
        category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        district:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        attachments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IssueAttachment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true

    IssueAuthor:
      type: object
      description: >-
        Ownership-safe author summary. For anonymous issues this contains only
        is_anonymous=true and display_name with the stable alias; user_id is not
        returned even though the database keeps ownership via issues.user_id.
      properties:
        is_anonymous:
          type: boolean
        id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        display_name:
          type: string
          example: Melder#A1B2C3D4

    IssueAttachment:
      type: object
      description: >-
        Attachment metadata. Files are stored in non-public local development
        storage and are downloadable only through the authenticated download_url.
        Raw storage paths and public file URLs are not exposed.
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        original_name:
          type: string
          nullable: true
        file_type:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
          description: File size in bytes. Each uploaded file is limited to 5 MB.
        uploaded_at:
          type: string
          format: date-time
        download_url:
          type: string
          description: Authenticated download endpoint for this attachment.

