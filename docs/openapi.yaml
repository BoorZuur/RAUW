                $ref: 'openapi/schemas.yaml#/components/schemas/CommunityPost'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [ Community Posts ]
      summary: Update a community post
      description: >-
        Partial update of a community post. Only the authoring active officer
        may update. Requires hub-active shift (Tier C).
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/CommunityPostUpdate'
      responses:
        '200':
          description: Updated community post
          content:
            application/json:
