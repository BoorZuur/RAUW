          application/json:
            schema:
              $ref: '#/components/schemas/DistrictCreate'
            example:
              name: Nieuwe Wijk
              hub_id: 3
              postal_prefix: '3017'
              center_lat: 51.91000000
              center_lng: 4.48000000
              radius_meters: 1200
              is_active: true
      responses:
        '201':
          description: District created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/districts/{districtId}:
    parameters:
      - name: districtId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Districts ]
      summary: Show a district
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: District resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Districts ]
      summary: Update a district
      description: >-
        Only an authenticated, active main manager may update districts. Users,
        officers, ordinary managers, inactive managers, and unauthenticated
        requests receive **403**. Set `is_active` to false to deactivate or true
        to reactivate; this is the sole activation path (no `/disable` route).
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictUpdate'
            example:
              name: Nieuwe Wijk bijgewerkt
              is_active: true
      responses:
        '200':
          description: District updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Districts ]
      summary: Replace/update a district
      description: >-
        Same behavior and validation as PATCH /api/districts/{districtId}.
        Only an authenticated, active main manager may call district writes;
        others receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistrictUpdate'
      responses:
        '200':
          description: District updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Districts ]
      summary: Delete an eligible district
      description: >-
        Only an authenticated, active main manager may delete districts. Users,
        officers, ordinary managers, inactive managers, and unauthenticated
        requests receive **403**. Deletion returns **409 Conflict** when the
        district is still assigned to any manager, assigned to any officer, or
        referenced by any issue through issues.district_id.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: District deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >-
        Laravel Sanctum personal access token sent as `Authorization: Bearer
        {token}`. Tokens expire after 7 days (10080 minutes;
        `SANCTUM_TOKEN_EXPIRATION`). Required on all `/api/*` routes except public
        auth registration and login. After the token resolves to a user, officer, or
        manager, the
        `actor.active` middleware returns **403** with message
        `This account is inactive.` when `is_active` is false, except on
        whitelisted routes: GET `/api/auth/me`, POST `/api/auth/logout`, and
        PATCH `/api/auth/me`. Other **403** responses on protected routes use
        `This action is unauthorized.` when FormRequest authorization fails.
        See `#/components/responses/InactiveAccount` and `#/components/responses/Forbidden`.

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    perPage:
      name: per_page
      in: query
      description: Backend-driven page size. Defaults to 20 and is capped at 100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >-
        FormRequest authorization failed on a protected route (`This action is
        unauthorized.`). Not used for deactivated accounts; those receive
        InactiveAccount from global middleware instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: This action is unauthorized.
    InactiveAccount:
      description: >-
        Authenticated account is inactive. Returned by global middleware on
        protected routes when the bearer token is valid but the actor's account
        is deactivated. Whitelisted while inactive: GET /api/auth/me, POST
        /api/auth/logout, PATCH /api/auth/me. Login rejects inactive credentials
        with 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: This account is inactive.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Resource not found.
    ConflictError:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'
    ServerError:
      description: >-
        Unexpected server error. With APP_DEBUG=false, responses use a safe
        generic message and never include SQL, bindings, or stack traces.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Server error.

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties: true

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ConflictError:
      type: object
      properties:
        message:
          type: string
      example:
        message: Cannot delete a main category while it still has subcategories.

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    MainManagerUpdate:
      type: object
      description: >-
        Partial main-manager identity update. All fields are optional; send only
        fields to change. When password is present, confirm_password is required
        and must match. Privileged fields (is_main_manager, is_active,
        created_by_manager_id, department_ids, and district_ids) are not
        accepted on this path.
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique manager username. Uniqueness is checked within managers.
        email:
          type: string
          format: email
          description: Unique email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Required when password is present; must exactly match password.

    ManagerCreate:
      type: object
      required: [ username, email, password, confirm_password, department_ids ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique manager username. Uniqueness is checked within managers.
        email:
          type: string
          format: email
          description: Unique manager email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.
        department_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Existing active department IDs (`is_active=true`). Managers must have
            one or more departments; inactive or unknown IDs return 422.
          items:
            type: integer
        district_ids:
          type: array
          uniqueItems: true
          description: Optional active district IDs to attach through the district_manager pivot.
          items:
            type: integer

    Officer:
      type: object
      description: Officer resource returned by officer list and administration endpoints.
      properties:
        actor_type:
          type: string
          enum: [ officer ]
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        badge_number:
          type: string
        is_active:
          type: boolean
        hub_id:
          type: integer
          nullable: true
        hub:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Hub'
        departments:
          type: array
          description: Compact department objects. Officers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        districts:
          type: array
          description: Compact district objects assigned through the district_officer pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    Manager:
      type: object
      description: Manager resource returned by manager creation. No bearer token is issued.
      properties:
        actor_type:
          type: string
          enum: [ manager ]
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        is_main_manager:
          type: boolean
        created_by_manager_id:
          type: integer
          nullable: true
        hub_id:
          type: integer
          nullable: true
        hub:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Hub'
        departments:
          type: array
          description: Compact department objects. Managers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        districts:
          type: array
          description: Compact district objects assigned through the district_manager pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    OfficerRegisterRequest:
      type: object
      required: [ username, email, password, confirm_password, badge_number, department_ids ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique officer username. Uniqueness is checked within officers.
        email:
          type: string
          format: email
          description: Unique officer email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.
        badge_number:
          type: string
          maxLength: 20
          description: Unique officer badge number.
        department_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Existing active department IDs. Officers must have one or more
            departments; inactive department IDs are rejected with 422.
          items:
            type: integer
        district_ids:
          type: array
          uniqueItems: true
          description: Optional active district IDs to attach through the district_officer pivot.
          items:
            type: integer

    UserRegisterRequest:
      type: object
      required: [ username, email, password, confirm_password ]
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique user username. Uniqueness is checked within users.
        email:
          type: string
          format: email
          description: Unique user email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Must exactly match password.

    AuthProfileUpdate:
      type: object
      description: >-
        Partial self-service identity update. All fields are optional; send only
        fields to change. Active actors: users and managers may send username,
        email, and password; officers may also send badge_number. Inactive actors
        may only send username and password (email and badge_number are
        prohibited with 422). When password is present, confirm_password is
        required and must match. Department, district, and privileged fields are
        not accepted on this path.
      properties:
        username:
          type: string
          maxLength: 50
          description: Unique username within the authenticated actor's table.
        email:
          type: string
          format: email
          description: Unique email address across users, officers, and managers.
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          description: Required when password is present; must exactly match password.
        badge_number:
          type: string
          maxLength: 20
          description: Officers only. Unique officer badge number.

    AuthResponse:
      type: object
      description: >-
        Auth response wrapper. Token-issuing responses include token_type and
        access_token. The actor_type field is emitted once at the top level and
        is not duplicated inside profile.
      required: [ token_type, access_token, actor_type, profile ]
      properties:
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
          description: >-
            Plain-text Laravel Sanctum token. Use as Authorization Bearer header
            value (format `Bearer <token>`).
        actor_type:
          type: string
          enum: [ user, officer, manager ]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AuthUserProfile'
            - $ref: '#/components/schemas/AuthOfficerProfile'
            - $ref: '#/components/schemas/AuthManagerProfile'

    AuthCurrentProfileResponse:
      type: object
      description: >-
        Current authenticated actor response. No token fields are included.
        actor_type is emitted once at the top level and is not duplicated inside
        profile.
      required: [ actor_type, profile ]
      properties:
        actor_type:
          type: string
          enum: [ user, officer, manager ]
        profile:
          oneOf:
            - $ref: '#/components/schemas/AuthUserProfile'
            - $ref: '#/components/schemas/AuthOfficerProfile'
            - $ref: '#/components/schemas/AuthManagerProfile'

    AuthUserProfile:
      type: object
      description: Clean user profile payload returned in auth responses.
      required: [ id, username, email ]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email

    AuthOfficerProfile:
      type: object
      description: Safe officer profile payload returned by login, officer registration, and current profile. Internal fields such as actor_type, district_id, and is_active are omitted.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        badge_number:
          type: string
        hub_id:
          type: integer
          nullable: true
        hub:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Hub'
        departments:
          type: array
          description: Compact department objects. Officers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        districts:
          type: array
          description: Compact district objects assigned through the district_officer pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    AuthManagerProfile:
      type: object
      description: Safe manager profile payload returned by login and current profile. Internal fields such as actor_type, district_id, is_active, and created_by_manager_id are omitted.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        departments:
          type: array
          description: Compact department objects. Managers must have one or more departments.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        is_main_manager:
          type: boolean
        hub_id:
          type: integer
          nullable: true
        hub:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Hub'
        districts:
          type: array
          description: Compact district objects assigned through the district_manager pivot.
          items:
            $ref: '#/components/schemas/AuthDistrictProfile'

    AuthDepartmentProfile:
      type: object
      description: Compact department data returned in actor auth/profile payloads.
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer

    AuthDistrictProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        postal_prefix:
          type: string

    Hub:
      type: object
      description: >-
        Rotterdam BOA cluster hub. Districts belong to exactly one hub. Officers
        and managers have a home hub via hub_id; their district pivots must stay
        within that hub.
      properties:
        id:
          type: integer
        name:
          type: string
          example: Cluster Centrum
        address:
          type: string
          example: Zalmstraat 7
        postal_code:
          type: string
          example: '3016 DS'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        districts_count:
          type: integer
          nullable: true
        officers_count:
          type: integer
          nullable: true
        managers_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HubCreate:
      type: object
      required: [ name, address, postal_code ]
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 10
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true

    HubUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        address:
          type: string
          maxLength: 255
        postal_code:
          type: string
          maxLength: 10
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true

    HubAssignmentUpdate:
      type: object
      required: [ hub_id ]
      properties:
        hub_id:
          type: integer
          description: >-
            Existing hub ID. Changing hub clears the actor's district pivot so
            assignments can be re-established within the new hub.

    District:
      type: object
      description: >-
        District record (Rotterdam wijk). Each district belongs to one hub.
        Managers and officers are assigned to districts through district_manager
        and district_officer many-to-many pivots within their home hub. The
        issues.district_id field remains a singular issue location/reference and
        is not changed by actor district assignment endpoints.
      properties:
        id:
          type: integer
        hub_id:
          type: integer
        hub:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Hub'
        name:
          type: string
        postal_prefix:
          type: string
        center_lat:
          type: number
          format: double
        center_lng:
          type: number
          format: double
        radius_meters:
          type: integer
          nullable: true
        is_active:
          type: boolean
        managers_count:
          type: integer
          nullable: true
        officers_count:
          type: integer
          nullable: true
        issues_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DistrictCreate:
      type: object
      required: [ name, hub_id ]
      properties:
        name:
          type: string
          maxLength: 100
        hub_id:
          type: integer
          description: Existing hub ID the district belongs to.
        postal_prefix:
          type: string
          maxLength: 10
          nullable: true
        center_lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        center_lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        radius_meters:
          type: integer
          minimum: 1
          nullable: true
        is_active:
          type: boolean
          default: true

    DistrictUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        hub_id:
          type: integer
          description: Existing hub ID when reassigning a district to another hub.
        postal_prefix:
          type: string
          maxLength: 10
          nullable: true
        center_lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          nullable: true
        center_lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          nullable: true
        radius_meters:
          type: integer
          minimum: 1
          nullable: true
        is_active:
          type: boolean
          description: >-
            Set to false to deactivate or true to reactivate. Sole activation
            path for districts.

    DistrictAssignmentUpdate:
      type: object
      required: [ district_ids ]
      properties:
        district_ids:
          type: array
          uniqueItems: true
          description: >-
            Full replacement set of active district IDs. Use an empty array to
            clear all actor district assignments. When the target officer or
            manager has a hub_id, every district must belong to that hub;
            cross-hub IDs return **422**. Duplicate IDs and inactive or unknown
            districts return validation errors.
          items:
            type: integer

    DepartmentAssignmentUpdate:
      type: object
      required: [ department_ids ]
      properties:
        department_ids:
          type: array
          uniqueItems: true
          description: >-
            Full replacement set of active department IDs (`is_active=true`) from
            the departments table. The key must be present. Use an empty array to
            clear all actor department assignments (valid for PATCH; differs from
            create/register flows that require at least one department). Duplicate,
            inactive, and unknown department IDs return **422**.
          items:
            type: integer

    Category:
      type: object
      description: >-
        Category resource. Categories are assigned to departments through the
        category_department many-to-many pivot. Categories use a two-level
        hierarchy: main categories have parent_id null and use priority for
        ordering (lower number = higher urgency); subcategories reference a main
        category through parent_id, order alphabetically by name, and cannot
        have children (no sub-under-sub).
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        parent_id:
          type: integer
          nullable: true
        is_main_category:
          type: boolean
        priority:
          type: integer
          nullable: true
          description: Main-category ordering value; lower number means higher priority. Null for subcategories.
        parent:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CategoryParentSummary'
        departments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/DepartmentSummary'
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategoryParentSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    DepartmentSummary:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer
        is_active:
          type: boolean

    CategoryDepartmentAssignment:
      type: object
      description: Pivot assignment between a category and a department.
      properties:
        category_id:
          type: integer
        department_id:
          type: integer

    CategoryCreate:
      type: object
      required: [ name, department_ids ]
      properties:
        name:
          type: string
          maxLength: 100
        parent_id:
          type: integer
          nullable: true
          description: >-
            Null for main categories. Subcategories must reference an active main
            category; subcategories cannot have children (no sub-under-sub).
        department_ids:
          type: array
          minItems: 1
          description: Existing department ids to attach through the category_department pivot.
          items:
            type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Main categories only; lower number means higher priority.
        is_active:
          type: boolean
          default: true

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        parent_id:
          type: integer
          nullable: true
          description: >-
            When present, must reference a main category. Subcategories cannot
            have children.
        department_ids:
          type: array
          minItems: 1
          description: When present, replaces the category's department assignments.
          items:
            type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
          description: Main categories only; lower number means higher priority.
        is_active:
          type: boolean
          description: >-
            Set to false to deactivate or true to reactivate. Sole activation
            path for categories.

    Department:
      type: object
      description: >-
        Department table row. Categories are assigned to one or more departments
        through category_department. Managers reference one or more departments
        through department_manager. Officers reference one or more departments
        through department_officer. Activation and deactivation use PATCH with
        `is_active` (main manager only). Deleting a department is blocked while
        it is assigned to managers or officers;
        otherwise it cascades only category and issue pivot assignments and does
        not delete category or issue rows. Issue departments are derived from
        categories, stored through the department_issue pivot, and exposed to
        clients as read-only arrays.
      properties:
        id:
          type: integer
        code:
          type: string
          example: wijkbeheer
        name:
          type: string
          example: Wijkbeheer
        is_active:
          type: boolean
        categories_count:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DepartmentCreate:
      type: object
      required: [ code, name ]
      properties:
        code:
          type: string
          maxLength: 50
          description: Stable unique department code.
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          default: true

    DepartmentUpdate:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: Stable unique department code.
        name:
          type: string
          maxLength: 100
        is_active:
          type: boolean
          description: >-
            Set to false to deactivate or true to reactivate. Sole activation
            path for departments. Deactivation may return **409** when still
            referenced.

    IssueCreate:
      type: object
      description: >-
        Client payload for creating an issue (active regular users only).
        district_id is required and must reference an active district.
        Departments are derived server-side from the selected category's
        department assignments and are not accepted in the request. The integer
        priority (unsigned tinyint scale, lower = higher urgency) is derived
        server-side from the selected category's main-category priority and must
        not be sent; legacy string priorities (laag/midden/zwaar) are not accepted.
        Removed legacy locality fields are not accepted. Anonymous aliases are
        generated server-side; anonymous issues remain owned by the authenticated
        user via user_id.
      required: [ title, content, category_id, district_id ]
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        category_id:
          type: integer
        district_id:
          type: integer
          description: Required active district ID for the issue location/reference.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        address:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        is_anonymous:
          type: boolean
          default: false

    IssueUpdate:
      type: object
      description: >-
        Owner-editable issue fields. All fields are optional for PATCH/PUT and
        only supplied fields are changed. user_id, status, priority,
        visibility, anonymous_alias, department assignments, and counters are
        server-owned; priority and visibility must not be sent. When category_id
        is supplied, departments and integer priority are re-derived from that
        category's main-category priority. Officers and managers change
        visibility through PATCH /api/issues/{issueId}/visibility. The public
        API no longer accepts removed legacy locality fields or client-supplied
        department values.
      properties:
        title:
          type: string
          maxLength: 255
        content:
          type: string
        category_id:
          type: integer
        district_id:
          type: integer
        postal_code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        is_anonymous:
          type: boolean

    IssueVisibilityUpdate:
      type: object
      required: [ visibility ]
      description: >-
        Officer/manager visibility write payload. Active officers and active
        managers may set an issue to visible or hidden when they can view the
        issue.
      properties:
        visibility:
          type: string
          enum: [ visible, hidden ]
          description: Target visibility for the issue.

    Issue:
      type: object
      description: >-
        Issue resource. Anonymous issues remain user-owned in the database
        through user_id, but the response exposes only an author display alias
        such as Melder#A1B2C3D4 and never leaks the owning user's id. Non-anonymous
        issues include author identity when loaded. Attachments include
        authenticated download URLs only. Department assignments are stored in
        department_issue, derived from the issue category, and exposed as a
        read-only departments array only (no singular department property on
        requests or responses).
      properties:
        id:
          type: integer
        category_id:
          type: integer
        district_id:
          type: integer
        title:
          type: string
        content:
          type: string
        postal_code:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        departments:
          type: array
          nullable: true
          description: >-
            Read-only compact departments assigned to the issue through the
            department_issue pivot. Derived from the selected category on create
            and whenever category_id changes.
          items:
            $ref: '#/components/schemas/AuthDepartmentProfile'
        status:
          type: string
          enum: [ open, in_behandeling, opgelost, gesloten ]
        assigned_officer_id:
          type: integer
          nullable: true
          description: >-
            Read-only nullable officer assignee id. Not accepted on user-owned create
            or update requests.
        visibility:
          type: string
          enum: [visible, hidden]
          description: >-
            Issue visibility. Visible issues appear in public-scoped lists; hidden
            issues are visible only to officers, managers, and the owning user.
            Not accepted on user-owned create or update requests. Active officers
            and managers may change it through PATCH /api/issues/{issueId}/visibility.
        priority:
          type: integer
          nullable: true
          description: >-
            Server-derived integer priority copied from the issue category's
            main-category priority on create and whenever category_id changes.
            Lower number means higher urgency; same scale as categories.priority.
        is_anonymous:
          type: boolean
        author:
          $ref: '#/components/schemas/IssueAuthor'
        participant_count:
          type: integer
        duplicate_count:
          type: integer
        category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        district:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        attachments:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/IssueAttachment'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true

    IssueAuthor:
      type: object
      description: >-
        Ownership-safe author summary. For anonymous issues this contains only
        is_anonymous=true and display_name with the stable alias; user_id is not
        returned even though the database keeps ownership via issues.user_id.
        For non-anonymous issues with the user relation loaded, id and username
        are exposed and display_name equals username.
      properties:
        is_anonymous:
          type: boolean
        id:
          type: integer
          nullable: true
        username:
          type: string
          nullable: true
        display_name:
          type: string
          description: >-
            Username for non-anonymous authors when the user relation is loaded;
            stable anonymous alias (e.g. Melder#A1B2C3D4) for anonymous issues.
          example: Melder#A1B2C3D4

    IssueAttachment:
      type: object
      description: >-
        Attachment metadata. Files are stored in non-public local development
        storage and are downloadable only through the authenticated download_url.
        Raw storage paths and public file URLs are not exposed.
      properties:
        id:
          type: integer
        issue_id:
          type: integer
        original_name:
          type: string
          nullable: true
        file_type:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
          description: File size in bytes. Each uploaded file is limited to 5 MB.
        uploaded_at:
          type: string
          format: date-time
        download_url:
          type: string
          description: Authenticated download endpoint for this attachment.

