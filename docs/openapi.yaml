  /api/officer-sessions:
    get:
      tags: [ Officers ]
      summary: List officer login sessions
      description: >-
        Paginated read-only list of officer login sessions (audit/shift tracking).
        Rows are created on officer login and start-shift. Session `id` is the
        public identifier; internal token FK is not returned. Only an authenticated,
        active manager may call this endpoint; users, officers, and inactive
        managers receive **403**. Results are ordered newest-first by `shift_start`
        then `id`. Optional filters: `officer_id`, `hub_id`, `is_hub_active`
        (truthy/falsy). Officers may reach this route without an active shared
        shift (whitelisted) but still receive **403** from authorization.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: officer_id
          in: query
          schema:
            type: integer
        - name: hub_id
          in: query
          schema:
            type: integer
        - name: is_hub_active
          in: query
          description: >-
            Filter by hub-active sessions. Truthy (`true`, `1`) or falsy
            (`false`, `0`). Omit to return all sessions regardless of hub-active
            state.
          schema:
            type: string
            enum: [ 'true', 'false', '1', '0' ]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Backend-paginated list of officer sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/OfficerSession'
                  links:
                    type: object
                  meta:
                    type: object
              example:
                data:
                  - id: 1
                    officer_id: 1
                    officer:
                      id: 1
                      username: demo-officer
                      badge_number: BOA-0001
                    hub_id: 3
                    hub:
                      id: 3
                      name: Cluster Centrum
                      address: Zalmstraat 7
                      postal_code: '3016 DS'
                      latitude: 51.9106846
                      longitude: 4.4814932
                      radius_meters: 100
                      is_active: true
                    shift_start: '2026-06-08T12:00:00+00:00'
                    shift_end: null
                    start_lat: 51.9106846
                    start_lng: 4.4814932
                    distance_meters_at_login: 0
                    is_hub_active: true
                    hub_active_until: '2026-06-08T22:00:00+00:00'
                    last_lat: null
                    last_lng: null
                    last_seen_at: null
                    is_active: true
                    created_at: '2026-06-08T12:00:00+00:00'
                    updated_at: '2026-06-08T12:00:00+00:00'
                links:
                  first: /api/officer-sessions?page=1
                  last: /api/officer-sessions?page=1
                meta:
                  current_page: 1
                  per_page: 20
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/officers:
    get:
      tags: [ Officers ]
      summary: List officers
      description: >-
        List officers for an authenticated active officer or manager. Results are
        hub-scoped for officers and ordinary managers (same `hub_id` only; null
        `hub_id` yields no rows); main managers see all officers city-wide.
        Results are ordered by username ascending and include each officer's
        departments and districts as compact arrays. Soft-deleted officers are
        always excluded. When `is_active` is omitted, only active officers are
        returned. Use `is_active=true` or `is_active=1` to request active
        officers explicitly, or `is_active=false` or `is_active=0` to request
        inactive officers only. Optional `district_id` and `department_id`
        filters narrow the hub-scoped result set through the officer's
        district_officer and department_officer pivots. Users and inactive actors
        receive 403. Pagination is backend-driven using page and per_page, with
        a default per_page of 20 and maximum of 100.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: district_id
          in: query
          description: Filter to officers assigned to this district.
          schema:
            type: integer
        - name: department_id
          in: query
          description: Filter to officers assigned to this department.
          schema:
            type: integer
        - name: is_active
          in: query
          description: >-
            Active-state filter. Truthy values (`true`, `1`) return active officers
            only; falsy values (`false`, `0`) return inactive officers only. When
            omitted, the list defaults to active officers only.
          schema:
            type: string
            enum: [ 'true', 'false', '1', '0' ]
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Backend-paginated list of officers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/Officer'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
              example:
                data:
                  - actor_type: officer
                    id: 1
                    username: demo-officer
                    email: demo.officer@example.com
                    badge_number: BOA-0001
                    is_active: true
                    departments:
                      - id: 1
                        code: wijkbeheer
                        name: Wijkbeheer
                    districts:
                      - id: 1
                        name: Cool
                        postal_prefix: '3012'
                links:
                  first: /api/officers?page=1
                  last: /api/officers?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  per_page: 20
                  total: 1
                  last_page: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/{officerId}:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Officers ]
      summary: Show an officer profile
      description: >-
        Return a single officer profile with eager-loaded departments, districts,
        and hub. Available to any authenticated active actor (users, officers,
        and managers). Results are city-wide with no hub scoping. Soft-deleted
        officers return 404 from route model binding. Inactive actors receive
        403 from global middleware. **Officer shared shift:** **Tier B** browse
        read — officers without an active shared shift may still call this endpoint.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Officer profile
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Officer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/officers/{officerId}/disable:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Officers ]
      summary: Disable an officer
      description: >-
        Deactivate an officer as an authenticated active manager by setting
        is_active to false while preserving the row and associations. This does
        not soft-delete the officer. Only an authenticated active manager may
        call this endpoint. Ordinary managers may administer only officers in
        the same hub; main managers may administer any officer city-wide. Hub
        mismatch returns 404 (not 403) to avoid leaking officer existence.
        Users, officers, inactive managers, and unauthenticated requests receive
        403. Soft-deleted officers return 404.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Officer disabled
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Officer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/officers/{officerId}/enable:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Officers ]
      summary: Enable an officer
      description: >-
        Reactivate an officer as an authenticated active manager by setting
        is_active to true. This does not restore a soft-deleted officer. Only an
        authenticated active manager may call this endpoint. Ordinary managers
        may administer only officers in the same hub; main managers may
        administer any officer city-wide. Hub mismatch returns 404 (not 403).
        Users, officers, inactive managers, and unauthenticated requests receive
        403. Re-enabling an already active officer is idempotent and returns 200.
        Soft-deleted officers return 404.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Officer enabled
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Officer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/officers/{officerId}/end-shift:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Officers ]
      summary: End an officer's shared shift
      description: >-
        Clears `hub_active_until` for the target officer (ends the shared shift).
        Does **not** revoke Sanctum tokens; officers retain authentication but
        Tier C workflow routes return **403** `hub_active_required` until a new
        shift is started. Only an authenticated active manager may call this
        endpoint. Ordinary managers may administer only officers in the same
        hub; main managers may administer any officer city-wide. Hub mismatch
        returns 404 (not 403). Empty request body.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Officer resource after shift ended
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Officer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/officers/{officerId}/hub:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Officers ]
      summary: Set an officer's hub
      description: >-
        Assign an active hub to an officer and clear their district_officer
        pivot so district assignments can be re-established within the new
        hub. Also clears `hub_active_until` (ends the shared shift) without
        revoking tokens. `hub_id` must reference an active hub (`is_active=true`);
        inactive or unknown hub IDs return **422**. Only an authenticated active
        manager may call this endpoint. Users, officers, inactive managers, and
        unauthenticated requests receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/HubAssignmentUpdate'
            example:
              hub_id: 3
      responses:
        '200':
          description: Refreshed officer auth profile with cleared districts
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/{officerId}/districts:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Managers ]
      summary: Update an officer's district assignments
      description: >-
        Manager-admin district assignment endpoint. Replaces the target officer's
        district assignments with the supplied district_ids array and returns that
        officer's refreshed profile. Only an authenticated active manager may
        call this endpoint. Ordinary managers may administer only officers in the
        same hub; main managers may administer any officer city-wide. Hub mismatch
        returns 404 (not 403). Users, officers, inactive managers, and
        unauthenticated requests cannot update officer districts. When the target
        officer has a `hub_id`, every district ID must belong to that hub;
        cross-hub districts return **422**. The endpoint updates only the
        district_officer pivot and never modifies issues.district_id.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DistrictAssignmentUpdate'
            example:
              district_ids: [1, 2]
      responses:
        '200':
          description: Refreshed officer profile
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
              example:
                actor_type: officer
                profile:
                  id: 1
                  username: demo-officer
                  email: demo.officer@example.com
                  badge_number: BOA-0001
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                  districts:
                    - id: 1
                      name: Cool
                      postal_prefix: '3012'
                    - id: 2
                      name: Oude Westen
                      postal_prefix: '3014'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/{officerId}/departments:
    parameters:
      - name: officerId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Managers ]
      summary: Update an officer's department assignments
      description: >-
        Main-manager-only department assignment endpoint. Replaces the target officer's department
        assignments with the supplied department_ids array and returns that
        officer's refreshed auth profile. Only an authenticated active main manager
        (is_main_manager=true) may call this endpoint. Users, officers, ordinary
        managers, inactive managers, inactive main managers, and unauthenticated
        requests receive 403. This differs from PATCH /api/officers/{officerId}/districts,
        which any authenticated active manager may call. The endpoint updates only
        the department_officer pivot. department_ids must be present and may be an
        empty array to clear all assignments; unlike officer registration, PATCH
        does         not require at least one department. Inactive (`is_active=false`), unknown
        department IDs, and duplicates return **422**. Soft-deleted officers return 404.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DepartmentAssignmentUpdate'
            examples:
              assignDepartments:
                summary: Replace with two departments
                value:
                  department_ids: [1, 2]
              clearDepartments:
                summary: Clear all department assignments
                value:
                  department_ids: []
      responses:
        '200':
          description: Refreshed officer profile
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
              example:
                actor_type: officer
                profile:
                  id: 1
                  username: demo-officer
                  email: demo.officer@example.com
                  badge_number: BOA-0001
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                    - id: 2
                      code: boa_jeugd
                      name: BOA Jeugd
                  districts:
                    - id: 1
                      name: Cool
                      postal_prefix: '3012'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/me/feedback:
    get:
      tags: [ Issue Feedback ]
      summary: List feedback on officer-involved issues
      description: >-
        Paginated list of user satisfaction feedback rows on issues where the
        authenticated officer was ever assigned (`issue_officer_assignment_histories`)
        or authored the officer resolution (`officer_issue_resolutions`). Officers
        may call this without an active shared shift (**Tier B**). Users and
        managers receive **403** (`This action is unauthorized.`). Reviewer
        identity follows the same anonymity rules as issue feedback on nested
        routes: owners see real `id`/`username`; other viewers see redacted
        participant aliases via `IssueCommentAuthor` shape. Optional filters
        narrow by `issue_id`, `submitted_from`, and `submitted_to` (inclusive
        date range; `submitted_to` must be on or after `submitted_from` when both
        are sent).
      security:
        - bearerAuth: [ ]
      parameters:
        - name: issue_id
          in: query
          required: false
          schema:
            type: integer
          description: Restrict to feedback rows for one issue id.
        - name: submitted_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Include rows with `submitted_at` on or after this date.
        - name: submitted_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Include rows with `submitted_at` on or before this date.
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated list of issue feedback rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueFeedback'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues:
    post:
      tags: [ Issues ]
      summary: Create a new issue
      description: >-
        Create an issue as an authenticated active regular user only. Officers,
        managers, inactive users, and unauthenticated requests receive **403**
        (`This action is unauthorized.`). The request requires category_id,
        district_id, title, and content. The issue's departments are derived
        server-side from the selected category's department assignments, synced
        to the department_issue pivot, and returned as a read-only departments
        array. Clients must not send department values. The database no longer
        stores issues.department; pivot rows are the only persistence. Location
        fields are optional. When is_anonymous is true the backend still stores
        user_id ownership, but generates and persists a stable anonymous alias
        such as Melder#A1B2C3D4 for public display; clients cannot submit the
        alias. The integer priority is derived server-side from the selected
        category's main-category priority (lower number = higher urgency) and
        must not be sent in the request body. Optional `duplicate_of_id` creates a
        hidden duplicate child linked to the resolved canonical target instead of a
        standalone issue. The child is returned with `visibility = hidden` and
        `duplicate_of_id` set; the canonical `duplicate_count` and
        `participant_count` are incremented when the author is not already a
        participant. Duplicate targets must be open or `in_behandeling` canonical
        issues visible to the author; the author cannot duplicate their own issue.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueCreate'
            examples:
              normalCreate:
                summary: Standalone issue
                value:
                  title: Parkeren op stoep
                  content: Er staat een auto op de stoep bij Coolsingel.
                  category_id: 1
                  district_id: 1
                  postal_code: '3012AB'
                  address: Coolsingel 1, Rotterdam
                  latitude: 51.91712000
                  longitude: 4.47834000
                  is_anonymous: true
              duplicateCreate:
                summary: Duplicate child linked to canonical issue 42
                value:
                  title: Zelfde parkeerprobleem
                  content: Ook bij mij staat er een auto op de stoep.
                  category_id: 1
                  district_id: 1
                  postal_code: '3012AB'
                  duplicate_of_id: 42
      responses:
        '201':
          description: Issue created (standalone or duplicate child)
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden. Deactivated accounts receive `This account is inactive.`
            (InactiveAccount). Officers, managers, and other non-user actors
            receive `This action is unauthorized.` (FormRequest authorize).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                inactiveAccount:
                  summary: Inactive bearer token (middleware)
                  value:
                    message: This account is inactive.
                unauthorizedRole:
                  summary: Officer or manager (authorize)
                  value:
                    message: This action is unauthorized.
        '404':
          description: >-
            Duplicate target not found or not visible to the author (`code:
            duplicate_target_not_found`).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              example:
                message: The duplicate target issue was not found.
                code: duplicate_target_not_found
        '422':
          description: >-
            Laravel field validation, or duplicate-link conflict (`code` on
            `IssueDuplicateConflictError`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              examples:
                issueNotMatchable:
                  summary: Target not open for duplicate linking
                  value:
                    message: The target issue is not open for duplicate linking.
                    code: issue_not_matchable
                cannotDuplicateSelf:
                  summary: Author owns the canonical target
                  value:
                    message: You cannot link a duplicate to your own issue.
                    code: cannot_duplicate_self

    get:
      tags: [ Issues ]
      summary: List issues with filters and pagination
      description: >-
        List issues for any authenticated active actor. Results are visibility-scoped
        by actor type before optional filters: active users receive issues with
        `visibility = visible` or issues they own (`issues.user_id` match), including
        their own hidden issues, or canonical issues they participate on (content
        redaction is applied at the resource layer); other users' hidden issues are
        excluded. Active officers and ordinary managers receive issues in their
        assigned districts only, including hidden issues in those districts. Main
        managers (`is_main_manager = true`) receive all issues city-wide. Filters
        are optional and composable (AND with visibility): district_id,
        department, category_id, status, assigned_officer_id, unassigned, mine, and visibility
        may be combined in a single request to narrow the result set. Query param status
        accepts any IssueStatus enum value (`open`, `in_behandeling`, `opgelost`, `gesloten`)
        and is available to all active actors; invalid values receive 422. Query param
        assigned_officer_id filters issues assigned to that officer; query param unassigned
        (`unassigned=1` or equivalent truthy values) returns only issues with no assigned
        officer. Assignee filters are available to officers and managers only; users receive
        422. assigned_officer_id and unassigned are mutually exclusive (422 when both are set).
        Query param mine (`mine=1` or equivalent truthy values) restricts
        active users to issues they own (`issues.user_id`); officers and managers sending
        mine receive 422. Query param participating (`participating=1`) restricts
        active users to owned duplicate children where they still participate on the
        canonical parent; officers and managers cannot use participating (422). `mine`
        and `participating` are mutually exclusive (422). Query param
        `include_duplicates` (`include_duplicates=1`) includes duplicate child rows
        for officers and managers; users cannot use include_duplicates (422). By
        default, user browse lists hide other users' duplicate children (canonical
        issues plus the actor's own children remain visible). Officer and manager
        browse lists exclude duplicate children unless `include_duplicates=1` is set.
        Query param visibility (`visible` or `hidden`) narrows officer/manager
        lists to that visibility value; when omitted officers and managers see all issues.
        Users sending visibility receive 422. Query param department accepts a department code from the departments
        table and matches through department_issue with any-match semantics, so a
        multi-department issue is included when any pivot assignment has the requested
        code.         Pagination is backend-driven using page and per_page, with a default
        per_page of 20 and maximum of 100. Results are ordered newest first.
        Each issue embeds `officer_resolution` (with officer and attachments)
        when a field report exists. `status_history` is omitted on list responses;
        use GET `/api/issues/{issueId}` for an unpaginated `status_history` embed
        (officers and managers only, newest first, without coordinates) or
        GET `/api/issues/{issueId}/status-history` for paginated history.

        **Officer shared shift:** Issue list is a **Tier B** browse read — officers
        without an active shared shift may still call this endpoint. Tier C
        workflow writes (assign-self, status, mark-duplicate, resolution
        POST/PATCH, resolution attachment DELETE) require an active shift.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: department
          in: query
          description: >-
            Optional composable department filter. Must be an existing department
            code and matches issues where any assigned department has this code.
          schema:
            type: string
            example: wijkbeheer
        - name: category_id
          in: query
          description: Optional composable category filter.
          schema:
            type: integer
        - name: district_id
          in: query
          description: Optional composable district filter.
          schema:
            type: integer
        - name: mine
          in: query
          description: >-
            Optional filter for active users only. When set to a truthy value (`1`,
            `true`), returns only issues owned by the authenticated user (`issues.user_id`),
            including the user's own hidden issues. Composes with default user visibility
            scoping (AND). Officers and managers cannot use this filter (422).
          schema:
            type: string
            enum: [ '1', 'true' ]
            example: '1'
        - name: visibility
          in: query
          description: >-
            Optional filter for active officers and managers only. When set to `hidden`,
            returns only hidden issues; when set to `visible`, returns only visible issues.
            When omitted, officers and managers receive all issues (visible and hidden).
            Composes with other filters (AND). Users cannot use this filter (422).
          schema:
            type: string
            enum: [ visible, hidden ]
            example: hidden
        - name: status
          in: query
          description: >-
            Optional composable status filter available to all active actors. Matches
            issues where status equals the provided IssueStatus enum value.
          schema:
            type: string
            enum: [ open, in_behandeling, opgelost, gesloten ]
            example: open
        - name: assigned_officer_id
          in: query
          description: >-
            Optional filter for active officers and managers only. Returns issues
            assigned to the given officer id. Composes with other filters (AND).
            Users cannot use this filter (422). Mutually exclusive with unassigned (422).
          schema:
            type: integer
            example: 1
        - name: unassigned
          in: query
          description: >-
            Optional filter for active officers and managers only. When set to a truthy
            value (`1`, `true`), returns only issues with no assigned officer
            (`assigned_officer_id` is null). Composes with other filters (AND).
            Users cannot use this filter (422). Mutually exclusive with assigned_officer_id (422).
          schema:
            type: string
            enum: [ '1', 'true' ]
            example: '1'
        - name: participating
          in: query
          description: >-
            Optional filter for active users only. When set to a truthy value (`1`,
            `true`), returns only duplicate child issues owned by the authenticated
            user where the user still participates on the canonical parent.
            Composes with other filters (AND). Officers and managers cannot use
            this filter (422). Mutually exclusive with mine (422).
          schema:
            type: string
            enum: [ '1', 'true' ]
            example: '1'
        - name: include_duplicates
          in: query
          description: >-
            Optional filter for active officers and managers only. When set to a
            truthy value (`1`, `true`), includes duplicate child rows in the
            result set. When omitted, officer and manager lists return canonical
            issues only. Users cannot use this filter (422).
          schema:
            type: string
            enum: [ '1', 'true' ]
            example: '1'
      responses:
        '200':
          description: Backend-paginated list of issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Inactive account (`code: account_inactive`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
              examples:
                inactiveAccount:
                  summary: Inactive bearer token
                  value:
                    message: This account is inactive.
                    code: account_inactive
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/similar-check:
    post:
      tags: [ Issues ]
      summary: Score similar open canonical issues before create
      description: >-
        Score up to 50 open or `in_behandeling` canonical issues in the requested
        district and return the top five matches split into `own_matches` (owned by
        the actor, `linkable: false`) and `matches` (other users' issues,
        `linkable: true`). Scoring considers category match, recency, postal prefix,
        and optional GPS distance bands. Active regular users only; officers,
        managers, inactive users, and unauthenticated requests receive **403**
        (`This action is unauthorized.`). Does not persist an issue.

        The candidate pool respects the same visibility rules as issue list/show
        for users: `visibility = visible` canonical issues, the actor's own
        issues (including hidden), and canonical issues the actor participates
        on (same rules as `GET /api/issues/{issueId}`). Other users' hidden
        issues are **excluded** from `matches`. The actor's own hidden issues may
        appear in `own_matches` only (`linkable: false`).
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/SimilarCheckRequest'
            example:
              district_id: 1
              category_id: 1
              postal_code: '3012AB'
              address: Coolsingel 1, Rotterdam
              latitude: 51.91712000
              longitude: 4.47834000
      responses:
        '200':
          description: Scored similar-issue candidates (max five per bucket)
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/SimilarCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden. Deactivated accounts receive `This account is inactive.`
            Officers, managers, and other non-user actors receive `This action is
            unauthorized.`
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: Get an issue by id
      description: >-
        Return one issue with eager-loaded relations. Active users may view issues
        with `visibility = visible`, issues they own (`issues.user_id` match,
        including their own hidden issues), or canonical issues they participate
        on (title/content/location/author/attachments redacted at the resource
        layer). Hidden issues owned by other users are not visible and return
        **404** (not 403) to avoid leaking existence — the same visibility pool
        applies to `POST /api/issues/similar-check`. Active officers and ordinary
        managers may view issues in their assigned districts only, including
        hidden issues in those districts. Main managers may view any issue
        city-wide. Inactive actors receive 403 from global middleware. When the
        issue exists but is outside the actor's district scope, the backend also
        returns 404 rather than 403.
        `officer_resolution` is embedded with officer and attachments when a
        report exists. Active officers and managers also receive `status_history`
        (newest first, without coordinates); regular users never receive
        `status_history`. List responses omit `status_history`. **Tier B** browse:
        officers without an active shared shift may still call this endpoint. Use
        GET `/api/issues/{issueId}/officer-resolution` for resolution-only reads
        and GET `/api/issues/{issueId}/status-history` for paginated status
        history.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Issue object
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [ Issues ]
      summary: Replace/update own issue
      description: Same partial-update behavior and validation as PATCH /api/issues/{issueId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueUpdate'
            example:
              title: Stoeptegel bij bushalte bijgewerkt
              content: De tegel ligt nu volledig los.
              category_id: 1
              district_id: 1
              is_anonymous: false
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [ Issues ]
      summary: Update own issue
      description: >-
        Partially update an issue owned by the authenticated active user. The
        owner is checked through issues.user_id, including for anonymous issues.
        Clients may update title, content, category_id, district_id, optional
        location fields, and is_anonymous. When category_id changes, departments
        and integer priority are re-derived from the selected category's
        main-category priority and returned as read-only fields. user_id, status,
        priority, counters, department assignments, visibility, and anonymous_alias are
        server-owned; clients must not send priority or visibility. Officers and
        managers change visibility through PATCH /api/issues/{issueId}/visibility.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueUpdate'
            example:
              title: Stoeptegel bij bushalte bijgewerkt
              content: De tegel ligt nu volledig los.
              category_id: 1
              district_id: 1
              is_anonymous: false
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [ Issues ]
      summary: Hard delete own issue
      description: >-
        Hard delete an issue owned by the authenticated active user. This is not
        a soft delete. The issue row is removed outright and issue attachments
        cascade with the issue through the database foreign key. Duplicate children
        decrement the canonical `duplicate_count`. Optional JSON body field
        `leave_participation` (default `false`) controls whether the owner's
        participation row on the canonical parent is removed when deleting a
        duplicate child; when `false`, canonical participation is kept and
        `via_issue_id` nulls via FK. Deleting a canonical issue with duplicate
        children promotes the oldest child to canonical and re-parents siblings;
        participant rows migrate to the promoted canonical.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DeleteIssueRequest'
            examples:
              defaultDelete:
                summary: Delete child but keep canonical participation
                value:
                  leave_participation: false
              leaveParticipation:
                summary: Delete child and leave canonical participation
                value:
                  leave_participation: true
      responses:
        '204':
          description: Issue hard deleted; attachments cascaded
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/visibility:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issues ]
      summary: Set issue visibility
      description: >-
        Set an issue's visibility to `visible` or `hidden`. Active officers and
        active managers only; users receive 403. The issue must be viewable by
        the caller (same rules as GET /api/issues/{issueId}); otherwise the
        backend returns 404. Only the visibility field is updated; user-owned
        PATCH /api/issues/{issueId} cannot change visibility.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueVisibilityUpdate'
            example:
              visibility: hidden
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/join:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Issues ]
      summary: Join a canonical issue as participant
      description: >-
        Manually join a canonical issue as a participant. Active regular users
        only; officers, managers, inactive users, and unauthenticated requests
        receive **403** (`This action is unauthorized.`). The route id must be a
        canonical issue; duplicate child ids return **422**
        `cannot_join_duplicate_child`. The issue must be visible to the actor;
        otherwise **404**. Optional JSON body field `is_anonymous` (boolean) marks
        the participation row anonymous; identity is redacted in participant list
        responses (`GET /api/issues/{issueId}/participants`). First join returns
        **201** with the canonical issue payload; repeat joins are idempotent and
        return **200** without creating a second participant row or incrementing
        `participant_count`.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                is_anonymous:
                  type: boolean
                  description: >-
                    When true, the participation row is marked anonymous and
                    user identity is redacted in participant list responses.
            example:
              is_anonymous: true
      responses:
        '200':
          description: Already participating (idempotent join)
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '201':
          description: Joined as new participant
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Duplicate child route id or other duplicate conflict
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              example:
                message: You must join the canonical issue, not a duplicate child.
                code: cannot_join_duplicate_child

  /api/issues/{issueId}/leave:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [ Issues ]
      summary: Leave canonical issue participation
      description: >-
        Remove the authenticated active user's participation row on the canonical
        issue and decrement `participant_count`. Active regular users only.
        Duplicate child route ids resolve to the canonical parent before leave.
        The canonical issue must be visible to the actor; otherwise **404**. When
        the actor is not a participant, returns **422** `not_participant`.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Participation removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Actor is not a participant on the canonical issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              example:
                message: You are not a participant on this issue.
                code: not_participant

  /api/issues/{issueId}/duplicates:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: List duplicate children for a canonical issue
      description: >-
        Paginated list of duplicate child issues for a canonical parent, ordered
        oldest-first by `created_at` then `id`. Active officers and active
        managers only; users receive **403** (`This action is unauthorized.`).
        District-scoped like issue browse: officers and ordinary managers see
        duplicates only when the canonical is in an assigned district; main
        managers are city-wide. The target must be a canonical issue; duplicate
        child route ids return **422** `issue_not_canonical`. Issues not visible
        to the actor (including outside district scope) return **404**. Each
        child uses the full `Issue` resource without participant redaction.
        **Officer shared shift:** This is a **Tier B** browse read — officers
        without an active shared shift may still call this endpoint.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Backend-paginated duplicate children
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Route targets a duplicate child instead of a canonical issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              example:
                message: The target issue is not a canonical issue.
                code: issue_not_canonical

  /api/issues/{issueId}/participants:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: List participants for a canonical issue
      description: >-
        Paginated list of participants on a canonical issue, ordered oldest-first
        by `joined_at` then `id`. Active officers and active managers only; users
        receive **403** (`This action is unauthorized.`). Duplicate child route
        ids resolve to the canonical parent. District-scoped like issue browse:
        officers and ordinary managers see participants only when the canonical
        is in an assigned district; main managers are city-wide. Issues not
        visible to the actor (including outside district scope) return **404**.
        Anonymous participants expose `is_anonymous: true` and a stable
        `display_name` alias instead of `user_id`/`username`. **Officer shared
        shift:** This is a **Tier B** browse read — officers without an active
        shared shift may still call this endpoint.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Backend-paginated issue participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueParticipant'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
              example:
                data:
                  - id: 1
                    joined_via: creator
                    via_issue_id: null
                    joined_at: '2026-06-01T10:00:00+00:00'
                    is_anonymous: false
                    user:
                      id: 5
                      username: demo.user
                  - id: 2
                    joined_via: manual
                    via_issue_id: null
                    joined_at: '2026-06-02T14:30:00+00:00'
                    is_anonymous: true
                    user:
                      is_anonymous: true
                      display_name: Deelnemer#000002
                links:
                  first: /api/issues/42/participants?page=1
                  last: /api/issues/42/participants?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  per_page: 20
                  total: 2
                  last_page: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/mark-duplicate:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
        description: >-
          The child issue to link. Must be a canonical, linkable issue (not
          already a duplicate child, no duplicate children of its own, status
          `open` or `in_behandeling`, unassigned, no officer resolution).
    post:
      tags: [ Issues ]
      summary: Link an existing issue as a duplicate (officer workflow)
      description: >-
        Link an existing issue (`issueId` in the route) to a canonical target
        (`duplicate_of_id` in the body). Active officers and active managers
        only; users receive **403**. Officers without an active shared shift
        receive **403** `hub_active_required` (Tier C). The child and canonical
        must both be visible to the actor (**404** `duplicate_target_not_found`
        when the child, target, or resolved canonical is missing or not visible).
        Officers must be assigned to both the child and canonical districts
        (**403** `officer_not_in_district`). If `duplicate_of_id` points at a
        duplicate child, the server resolves it to the canonical parent before
        linking.

        **Different owners** (`child.user_id !== canonical.user_id`): re-parent
        the child — set `duplicate_of_id`, `visibility = hidden`, increment
        canonical `duplicate_count`, and add the child owner as a canonical
        participant (`joined_via = duplicate`) when not already participating.
        Response **200** returns the **child** `Issue` resource (now hidden,
        with `duplicate_of_id` set).

        **Same owner** (`child.user_id === canonical.user_id`): merge
        participants onto the canonical (dedupe by `user_id`), recalculate
        `participant_count`, and **hard-delete** the child issue. Response
        **200** returns the **canonical** `Issue` resource (the child id no
        longer exists).

        Pre-lock validation runs before the transaction; canonical row lock and
        post-lock re-checks run inside `lockForUpdate`. Child must pass linkable
        checks; canonical must be `open` or `in_behandeling`.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/MarkIssueAsDuplicateRequest'
            example:
              duplicate_of_id: 42
      responses:
        '200':
          description: >-
            Linked issue. Different owners: hidden child `Issue`. Same owner:
            surviving canonical `Issue`.
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
              examples:
                differentOwners:
                  summary: Re-parent branch — returns child
                  value:
                    id: 99
                    duplicate_of_id: 42
                    visibility: hidden
                    duplicate_count: 0
                    participant_count: 1
                    status: open
                sameOwner:
                  summary: Merge branch — returns canonical
                  value:
                    id: 42
                    duplicate_of_id: null
                    visibility: visible
                    duplicate_count: 0
                    participant_count: 2
                    status: open
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden. Users receive `This action is unauthorized.`
            Officers without an active shared shift receive `hub_active_required`.
            Officers outside assigned districts receive `officer_not_in_district`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                hubActiveRequired:
                  summary: Officer without active shared shift
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
                officerNotInDistrict:
                  summary: Officer not assigned to issue district
                  value:
                    message: Officer is not assigned to this issue district.
                    code: officer_not_in_district
        '404':
          description: >-
            Child, target, or resolved canonical not found or not visible to the
            actor (`code: duplicate_target_not_found`).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              example:
                message: The duplicate target issue was not found.
                code: duplicate_target_not_found
        '422':
          description: >-
            Laravel field validation, or duplicate-link conflict (`code` on
            `IssueDuplicateConflictError`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueDuplicateConflictError'
              examples:
                issueNotMatchable:
                  summary: Canonical not open for duplicate linking
                  value:
                    message: The target issue is not open for duplicate linking.
                    code: issue_not_matchable
                issueNotLinkable:
                  summary: Child not linkable (status, assignee, or resolution)
                  value:
                    message: The issue cannot be linked as a duplicate in its current state.
                    code: issue_not_linkable
                issueIsDuplicateChild:
                  summary: Child is already a duplicate
                  value:
                    message: This operation requires a canonical issue, not a duplicate child.
                    code: issue_is_duplicate_child
                issueHasDuplicates:
                  summary: Child has duplicate children
                  value:
                    message: The issue has duplicate children and cannot be linked as a duplicate.
                    code: issue_has_duplicates
                cannotDuplicateSelf:
                  summary: Child and canonical are the same issue
                  value:
                    message: An issue cannot be marked as a duplicate of itself.
                    code: cannot_duplicate_self

  /api/issues/{issueId}/attachments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Attachments ]
      summary: Upload files for an issue
      description: >-
        Upload attachments to an issue owned by the authenticated active user.
        Each issue may hold at most 5 attachments in total. Each uploaded file is
        limited to 5 MB and must be jpg, jpeg, png, gif, webp, or pdf. After
        extension/MIME rules pass, the server content-sniffs images (Symfony MIME)
        and verifies PDFs via `%PDF-` magic bytes; mismatches return **422**. In
        local development files are stored on the non-public local disk and are
        served only through the authenticated download endpoint; no public
        storage URL is exposed. To replace files while editing an issue, delete
        existing attachments first, then upload new files within the same total
        limit.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ files ]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded attachments
          content:
            application/json:
              schema:
                type: object
                required: [ data ]
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueAttachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/attachments/{attachmentId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [ Attachments ]
      summary: Delete an issue attachment
      description: >-
        Hard delete one attachment from an issue owned by the authenticated active
        user only. Officers, managers, non-owner users, and unauthenticated
        requests receive **403** (`This action is unauthorized.`). Deactivated
        accounts receive **403** (`This account is inactive.`). The attachment must
        belong to the issue in
        the route; otherwise the backend returns 404. Deletion removes the backing
        file from non-public local storage when present and deletes the attachment
        row, enabling replace workflows before uploading new files.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Attachment hard deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/attachments/{attachmentId}/download:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Attachments ]
      summary: Download an issue attachment
      description: >-
        Stream an attachment from non-public local development storage.
        Visibility-only authorization (Q8 / D15-A): any authenticated actor who
        can view the parent issue may download
        (`IssueVisibilityQuery::canViewIssue`). **Tier B** for officers: no active
        shared shift required. Users probing hidden issues they do not own receive
        **404** (no enumeration). Other unauthorized actors receive **403**
        (`This action is unauthorized.`). Deactivated accounts receive **403**
        (`This account is inactive.`). Unauthenticated requests receive **401**.
        The attachment must belong to the issue in the route and the backing local
        file must still exist; otherwise the backend returns **404**.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/assign-self:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Issues ]
      summary: Self-assign officer to an issue
      description: >-
        Assign the authenticated active officer to an issue in one of their
        assigned districts. Active officers only; users, managers, and inactive
        officers receive **403**. Officers without an active shared shift receive
        **403** `hub_active_required` (Tier C). The issue must be viewable by
        the caller; otherwise **404**. When the officer is not assigned to the
        issue's district, **403** `officer_not_in_district`. Already assigned to
        the requesting officer is idempotent (**200**). When assigned to another
        officer, **409** `issue_already_assigned` (no takeover). When status is
        `opgelost` or `gesloten`, **422** `issue_not_assignable` (checked after
        row lock). When the issue status is `open`, self-assign also transitions
        it to `in_behandeling` and appends one status history row.
        `assigned_officer_id` is read-only on user-owned create/update; use this
        endpoint instead.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Issue with updated assignee (and status when transitioned from open)
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden. Non-officers receive `This action is unauthorized.`
            Inactive officers receive `account_inactive`. Officers without an
            active shared shift receive `hub_active_required`. Officers outside
            the issue district receive `officer_not_in_district`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                hubActiveRequired:
                  summary: Officer without active shared shift
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
                officerNotInDistrict:
                  summary: Officer not assigned to issue district
                  value:
                    message: Officer is not assigned to this issue district.
                    code: officer_not_in_district
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Issue already assigned to another officer
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowConflictError'
              example:
                message: Issue is already assigned to another officer.
                code: issue_already_assigned
        '422':
          description: >-
            Issue status does not allow assignment (`opgelost` or `gesloten`).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowUnprocessableError'
              example:
                message: Issues that are resolved or closed cannot be assigned.
                code: issue_not_assignable

  /api/issues/{issueId}/unassign-self:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Issues ]
      summary: Unassign officer from an issue
      description: >-
        Clear `assigned_officer_id` when the authenticated active officer is the
        current assignee. Status is unchanged. Active officers only. Officers
        without an active shared shift receive **403** `hub_active_required`.
        The issue must be viewable (**404** when not). District scoping applies
        (**403** `officer_not_in_district`). Already unassigned is idempotent
        (**200**). Non-assignees receive **403** `not_assigned_officer`.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Issue with cleared assignee
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (see assign-self for structured codes)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notAssignedOfficer:
                  summary: Officer is not the current assignee
                  value:
                    message: Only the assigned officer may unassign from this issue.
                    code: not_assigned_officer
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/status:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issues ]
      summary: Update issue status (officer workflow)
      description: >-
        Update an assigned issue's status along the directed officer workflow.
        Active officers only; only the current assignee may update status
        (**403** `not_assigned_officer` otherwise). Officers without an active
        shared shift receive **403** `hub_active_required`. District scoping
        applies (**403** `officer_not_in_district`). The issue must be viewable
        (**404** when not). Each successful change appends one status history row
        (without coordinates) and sets `resolved_at` on the first transition to
        `opgelost`. Allowed transitions: `open` → `in_behandeling`;
        `in_behandeling` → `opgelost`; `opgelost` → `gesloten`.
        Same status or invalid transitions receive **422** (Laravel validation
        `errors` object). Assignee and transition checks run after `lockForUpdate`
        (validate-after-lock).
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueStatusUpdate'
            example:
              status: opgelost
              note: Tegel vervangen en stoep hersteld.
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (see assign-self for structured codes)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/status-history:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: List status history for an issue
      description: >-
        Paginated audit trail of status changes for a canonical issue, ordered
        newest-first by `changed_at`. Active officers and active managers only;
        users receive **403** (`This action is unauthorized.`). Duplicate child
        route ids resolve to the canonical parent before querying. District-scoped
        like issue browse: officers and ordinary managers see history only when
        the canonical is in an assigned district; main managers are city-wide.
        Issues not visible to the actor (including outside district scope) return
        **404**. Each row uses `IssueStatusHistory` (no officer GPS coordinates).
        Query `page` (default 1) and `per_page` (default **20**, max **100**).
        **Officer shared shift:** **Tier B** browse read — officers without an
        active shared shift may still call this endpoint. Prefer this path over
        the unpaginated `status_history` embed on `GET /api/issues/{issueId}`.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Backend-paginated status history rows
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueStatusHistoryPaginated'
              example:
                data:
                  - id: 12
                    issue_id: 42
                    changed_by_officer_id: 3
                    old_status: in_behandeling
                    new_status: opgelost
                    note: Tegel vervangen.
                    changed_at: '2026-06-08T15:30:00+00:00'
                    officer:
                      id: 3
                      username: demo.officer
                  - id: 11
                    issue_id: 42
                    changed_by_officer_id: 3
                    old_status: open
                    new_status: in_behandeling
                    note: null
                    changed_at: '2026-06-08T10:00:00+00:00'
                    officer:
                      id: 3
                      username: demo.officer
                links:
                  first: /api/issues/42/status-history?page=1
                  last: /api/issues/42/status-history?page=1
                  prev: null
                  next: null
                meta:
                  current_page: 1
                  per_page: 20
                  total: 2
                  last_page: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/officer-resolution:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: Show officer resolution report
      description: >-
        Return the single officer resolution report for an issue. Any
        authenticated actor who can view the issue may read it; hidden issues
        return **404** when not visible. **Tier B** browse: officers without an
        active shared shift may still call this endpoint. Returns **404** when no
        resolution exists yet. Distinct from user satisfaction feedback in
        `issue_resolutions`.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Officer resolution object
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueResolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Issues ]
      summary: Create officer resolution report
      description: >-
        Create the officer field report for an issue (once per issue). Multipart
        upload. Only the authenticated active officer currently assigned to the
        issue may create it (**403** `not_assigned_officer` otherwise). Officers
        without an active shared shift receive **403** `hub_active_required`.
        District scoping applies (**403** `officer_not_in_district`). Duplicate
        POST returns **409** `officer_resolution_exists`; use PATCH to update an
        existing report. Blocked when issue status is `gesloten` (**422**
        `issue_closed`); issues in `opgelost` remain writable. Up to **3** image
        attachments (`jpg`, `jpeg`, `png`, `gif`, `webp`), each at most **5 MB**.
        After extension rules pass, uploads are content-sniffed as allowed images;
        mismatches return **422**. Attachment cap enforcement and disk I/O run
        inside the same `lockForUpdate` transaction as assignee and writability
        checks. Files are stored on non-public local storage and served only
        through authenticated download endpoints.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueResolutionCreate'
      responses:
        '201':
          description: Created officer resolution
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueResolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (see assign-self for structured codes)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notAssignedOfficer:
                  summary: Officer is not the current assignee
                  value:
                    message: Only the assigned officer may submit or update the resolution for this issue.
                    code: not_assigned_officer
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Officer resolution already exists for this issue
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowConflictError'
              example:
                message: An officer resolution already exists for this issue.
                code: officer_resolution_exists
        '422':
          description: >-
            Validation failure, or issue status is `gesloten` (`issue_closed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowUnprocessableError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                issue_closed:
                  value:
                    message: Cannot create or update a resolution on a closed issue.
                    code: issue_closed
    patch:
      tags: [ Issues ]
      summary: Update officer resolution report
      description: >-
        Update title, content, and image attachments on an existing officer
        resolution. Multipart upload. Only the authenticated active officer
        currently assigned to the issue may update it (**403**
        `not_assigned_officer` otherwise). Officers without an active shared
        shift receive **403** `hub_active_required`. District scoping applies
        (**403** `officer_not_in_district`). `officer_id` is overwritten with
        the editing officer (last editor). Blocked when issue status is
        `gesloten` (**422** `issue_closed`); issues in `opgelost` remain
        writable. Send `remove_attachment_ids` to delete owned attachments
        before uploading replacements; ids that do not belong to the resolution
        return **422** on `remove_attachment_ids`. Total attachments after
        removals plus new files must not exceed **3**. Attachment cap
        enforcement, removals, and new upload disk I/O run inside the same
        `lockForUpdate` transaction. New uploads are content-sniffed as allowed
        images. Returns **404** when no resolution exists.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueResolutionUpdate'
      responses:
        '200':
          description: Updated officer resolution
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/OfficerIssueResolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (see assign-self for structured codes)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notAssignedOfficer:
                  summary: Officer is not the current assignee
                  value:
                    message: Only the assigned officer may submit or update the resolution for this issue.
                    code: not_assigned_officer
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Validation failure, invalid `remove_attachment_ids`, or issue status
            is `gesloten` (`issue_closed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowUnprocessableError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                issue_closed:
                  value:
                    message: Cannot create or update a resolution on a closed issue.
                    code: issue_closed
                invalidRemoveAttachmentIds:
                  summary: Attachment ids not owned by this resolution
                  value:
                    message: One or more attachment ids do not belong to this resolution.
                    errors:
                      remove_attachment_ids:
                        - One or more attachment ids do not belong to this resolution.

  /api/issues/{issueId}/officer-resolution/attachments/{attachmentId}/download:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: Download officer resolution attachment
      description: >-
        Stream a resolution attachment from non-public local development storage.
        Visibility-only authorization (Q8 / D15-A): any authenticated actor who
        can view the parent issue may download
        (`IssueVisibilityQuery::canViewIssue`). **Tier B** for officers: no active
        shared shift required. Users probing hidden issues they do not own receive
        **404** (no enumeration). Other unauthorized actors receive **403**
        (`This action is unauthorized.`). Deactivated accounts receive **403**
        (`This account is inactive.`). Unauthenticated requests receive **401**.
        The attachment must belong to the issue's officer resolution in the route
        and the backing local file must still exist; otherwise the backend returns
        **404**.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/officer-updates:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issues ]
      summary: List officer updates for an issue
      description: >-
        List updates for a specific issue. Requires authentication. Any actor
        who can view the issue may view updates. **Tier B** browse: officers without
        an active shift may read updates. Returns updates in chronological order.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
