openapi: 3.0.3
info:
  title: WIJK App API
  description: >-
    OpenAPI 3.0 spec for the WIJK mobile/web API and officer/manager consoles.

    **Auth:** Laravel Sanctum bearer token on all `/api/*` routes except
    registration and login. Tokens expire after 7 days (`SANCTUM_TOKEN_EXPIRATION`).

    **Policies:** Inactive-account handling, officer Tier B/C access, structured
    error `code` values, issue chat rules, and GPS trust are documented in
    `docs/api-policy.md` (repository root). Per-endpoint behaviour is in each
    operation description below.

    **Schemas:** Reusable models and error types live in `docs/openapi/schemas.yaml`.

    **Health:** `GET /up` is omitted; it is not part of the `/api` JSON contract.
  version: '1.0.0'
servers:
  - url: /
    description: Backend host root; API routes are prefixed with /api.

tags:
  - name: Auth
    description: Registration, login, profile, districts, and officer shift start.
  - name: Managers
    description: Main manager and ordinary manager administration.
  - name: Officers
    description: Officer directory, sessions, districts, departments, and self-service reads.
  - name: Issues
    description: Issue lifecycle, assignments, status, attachments, and visibility.
  - name: Issue Comments
    description: Public issue comment threads.
  - name: Issue Feedback
    description: User satisfaction feedback on closed issues.
  - name: Issue Chat
    description: 1:1 officer–user chats and messages on canonical issues.
  - name: Community Posts
    description: District community news feed, attachments, and user saves.
  - name: Notifications
    description: Poll-friendly domain notifications for users and officers (Tier B officer routes).
  - name: Categories
    description: Issue category hierarchy and department assignments.
  - name: Departments
    description: Department reference and main-manager CRUD.
  - name: Hubs
    description: BOA hub clusters and geo login radius.
  - name: Districts
    description: District reference and main-manager CRUD.
  - name: Attachments
    description: File upload and download endpoints grouped with parent resources.
paths:
  /api/auth/register/officer:
    post:
      tags: [ Auth ]
      summary: Register a new officer and receive a Sanctum bearer token
      description: >-
        Backend API-only officer registration. Creates an Officer record,
        immediately issues a Sanctum bearer token, and returns the same auth
        response shape and safe profile serializer used by login. This endpoint
        does not create a session and does not require authentication. Officers
        must be assigned to one or more existing active departments through
        department_ids; inactive department IDs are rejected with 422. Optional
        district assignments use district_ids and are
        stored through the district_officer pivot; officers may also start with
        no assigned districts.         Requires `latitude` and `longitude` (device GPS) for validation and audit
        session rows. Registration **does not start a shift** — response is always
        `hub_active: false`, `hub_active_until: null`. Registration does not
        require `hub_id`; officers without a hub cannot use login until a
        manager assigns one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/OfficerRegisterRequest'
            example:
              username: new-officer
              email: new.officer@example.com
              password: password123
              confirm_password: password123
              badge_number: BOA-1234
              department_ids: [1]
              district_ids: [1]
              latitude: 51.9106846
              longitude: 4.4814932
      responses:
        '201':
          description: Officer created and authenticated with a Sanctum bearer token
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthResponse'
              example:
                token_type: Bearer
                access_token: 1|plain-text-sanctum-token
                actor_type: officer
                hub_active: false
                hub_active_until: null
                profile:
                  id: 1
                  username: new-officer
                  email: new.officer@example.com
                  badge_number: BOA-1234
                  hub_id: 3
                  hub_active: false
                  hub_active_until: null
                  departments:
                    - id: 1
                      code: wijkbeheer
                      name: Wijkbeheer
                  districts:
                    - id: 1
                      name: Cool
                      postal_prefix: '3012'
        '422':
          description: >-
            Validation failed. Returned when required fields are missing,
            email is invalid, password is shorter than 8 characters,
            confirm_password does not match password, department_ids is missing,
            empty, duplicated, or references unknown or inactive departments,
            latitude or longitude is missing or out of range for officers,
            or district_ids is duplicated or references inactive/unknown districts,
            or username/email/badge_number already exists in the officers table.
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    message: The username field is required. (and 4 more errors)
                    errors:
                      username:
                        - The username field is required.
                      email:
                        - The email field is required.
                      password:
                        - The password field is required.
                      confirm_password:
                        - The confirm password field is required.
                      badge_number:
                        - The badge number field is required.
                invalidFields:
                  summary: Invalid email, short password, and confirmation mismatch
                  value:
                    message: The email field must be a valid email address. (and 2 more errors)
                    errors:
                      email:
                        - The email field must be a valid email address.
                      password:
                        - The password field must be at least 8 characters.
                      confirm_password:
                        - The confirm password field must match password.
                duplicateIdentifiers:
                  summary: Duplicate officer identifiers
                  value:
                    message: The provided credentials could not be registered. (and 2 more errors)
                    errors:
                      username:
                        - The provided credentials could not be registered.
                      email:
                        - The provided credentials could not be registered.
                      badge_number:
                        - The provided credentials could not be registered.

  /api/auth/register/user:
    post:
      tags: [ Auth ]
      summary: Register a new user and receive a Sanctum bearer token
      description: >-
        Backend API-only public user registration. Creates a User record,
        immediately issues a Sanctum bearer token, and returns the same auth
        response shape and safe profile serializer used by login. This endpoint
        does not create a session and         does not require authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/UserRegisterRequest'
            example:
              username: new-user
              email: new.user@example.com
              password: password123
              confirm_password: password123
      responses:
        '201':
          description: User created and authenticated with a Sanctum bearer token
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthResponse'
              example:
                token_type: Bearer
                access_token: 1|plain-text-sanctum-token
                actor_type: user
                profile:
                  id: 1
                  username: new-user
                  email: new.user@example.com
        '422':
          description: >-
            Validation failed. Returned when required fields are missing,
            email is invalid, password is shorter than 8 characters,
            confirm_password does not match password, or username/email is
            already registered. Duplicate username or email (including email
            used by an officer or manager) returns the generic message
            `The provided credentials could not be registered.` on the
            offending fields without revealing which actor table holds the email.
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                missingFields:
                  summary: Missing required fields
                  value:
                    message: The username field is required. (and 3 more errors)
                    errors:
                      username:
                        - The username field is required.
                      email:
                        - The email field is required.
                      password:
                        - The password field is required.
                      confirm_password:
                        - The confirm password field is required.
                invalidFields:
                  summary: Invalid email, short password, and confirmation mismatch
                  value:
                    message: The email field must be a valid email address. (and 2 more errors)
                    errors:
                      email:
                        - The email field must be a valid email address.
                      password:
                        - The password field must be at least 8 characters.
                      confirm_password:
                        - The confirm password field must match password.
                duplicateIdentifiers:
                  summary: Duplicate user identifiers (generic message)
                  value:
                    message: The provided credentials could not be registered. (and 1 more error)
                    errors:
                      username:
                        - The provided credentials could not be registered.
                      email:
                        - The provided credentials could not be registered.

  /api/auth/login:
    post:
      tags: [ Auth ]
      summary: Login and receive tokens
      description: >-
        Authenticate a user, officer, or manager with shared email/password
        credentials. Returns a Sanctum bearer token (expires after 7 days / 10080
        minutes) and the canonical safe profile payload. Unknown email, wrong
        password, inactive accounts, and
        ambiguous email matches across actor tables all return the same generic
        **401** with message `Invalid credentials.` so callers cannot infer
        account state.

        **Officers** must include `latitude` and `longitude` (device GPS). Missing
        or invalid coordinates return **422**. When the officer has no `hub_id`,
        login returns **403** with `code: hub_not_assigned`. Hub-eligible login
        starts or joins the shared shift (`hub_active: true`, `hub_active_until`);
        re-login at hub does not extend an existing shift. Outside-radius login
        preserves an active shared shift (`hub_active: true`); without a shift,
        login succeeds with `hub_active: false`. The Sanctum `hub-active` ability
        is audit-only when login is hub-eligible. Users and managers ignore
        coordinate fields.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/LoginRequest'
            examples:
              userLogin:
                summary: User or manager login
                value:
                  email: demo.user@example.com
                  password: password
              officerHubLogin:
                summary: Officer login at assigned hub
                value:
                  email: demo.officer@example.com
                  password: password
                  latitude: 51.9106846
                  longitude: 4.4814932
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthResponse'
              examples:
                managerLogin:
                  summary: Manager login profile
                  value:
                    token_type: Bearer
                    access_token: 1|plain-text-sanctum-token
                    actor_type: manager
                    profile:
                      id: 1
                      username: demo-manager
                      email: demo.manager@example.com
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      is_main_manager: true
                      districts:
                        - id: 1
                          name: Cool
                          postal_prefix: '3012'
                officerHubLogin:
                  summary: Officer login within hub radius
                  value:
                    token_type: Bearer
                    access_token: 1|plain-text-sanctum-token
                    actor_type: officer
                    hub_active: true
                    hub_active_until: '2026-06-08T22:00:00+00:00'
                    profile:
                      id: 1
                      username: demo-officer
                      email: demo.officer@example.com
                      badge_number: BOA-0001
                      hub_id: 3
                      hub_active: true
                      hub_active_until: '2026-06-08T22:00:00+00:00'
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      districts:
                        - id: 1
                          name: Cool
                          postal_prefix: '3012'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Officer login blocked because hub is not assigned
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
              example:
                message: Officer hub assignment required before login.
                code: hub_not_assigned
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/me:
    get:
      tags: [ Auth ]
      summary: Current authenticated user
      description: >-
        Returns the authenticated actor_type and cleaned safe profile payload.
        This response does not issue a token. actor_type is only present at the
        top level; profile omits internal auth fields. Inactive accounts may
        still call this route (whitelisted by global inactive-actor middleware).
        For officers, the wrapper and profile include `hub_active` and
        `hub_active_until` derived from the officer's shared shift column
        (`officers.hub_active_until`), not the bearer token's Sanctum abilities.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
              examples:
                managerProfile:
                  summary: Current manager profile
                  value:
                    actor_type: manager
                    profile:
                      id: 1
                      username: demo-manager
                      email: demo.manager@example.com
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      is_main_manager: true
                      districts:
                        - id: 1
                          name: Cool
                          postal_prefix: '3012'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [ Auth ]
      summary: Update my profile identity fields
      description: >-
        Self-service identity update for users, officers, and managers.
        Inactive accounts may call this route for profile recovery
        (whitelisted by global inactive-actor middleware) but may only change
        username and password. Active accounts accept a partial PATCH body:
        send only the fields to change. Active users and managers may update
        username, email, and password; active officers may also update
        badge_number. When password is present, confirm_password must match.
        Inactive requests that include email or badge_number receive 422
        validation errors. Department, district, hub assignment (`hub_id`),
        shift (`hub_active_until`), and other privileged fields are rejected
        with 422 validation errors and must not be sent on this path.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/AuthProfileUpdate'
            examples:
              emailOnly:
                summary: Change email only
                value:
                  email: new.email@example.com
              passwordChange:
                summary: Change password
                value:
                  password: newpassword123
                  confirm_password: newpassword123
              officerBadge:
                summary: Officer badge number update
                value:
                  badge_number: BOA-0042
      responses:
        '200':
          description: Refreshed actor profile
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
              examples:
                userProfile:
                  summary: Updated user profile
                  value:
                    actor_type: user
                    profile:
                      id: 1
                      username: demo-user
                      email: new.email@example.com
                officerProfile:
                  summary: Updated officer profile
                  value:
                    actor_type: officer
                    profile:
                      id: 1
                      username: demo-officer
                      email: demo.officer@example.com
                      badge_number: BOA-0042
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      districts:
                        - id: 1
                          name: Cool
                          postal_prefix: '3012'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/start-shift:
    post:
      tags: [ Auth ]
      summary: Start the officer's shared shift at the assigned hub
      description: >-
        Active officers only. Starts the shared shift when the officer is within
        the assigned active hub's `radius_meters` and no shift is currently active.
        Requires `latitude` and `longitude`. Adds the `hub-active` Sanctum ability
        to the current token for audit and creates an `officer_sessions` row.
        Does not issue a new token. Whitelisted by `officer.hub-active` middleware
        (callable without an active shift). Officers without `hub_id` receive
        **403** `hub_not_assigned`. Outside hub radius receives **403**
        `outside_hub_radius`. Active shift receives **422** `shift_already_active`.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/StartOfficerShiftRequest'
            example:
              latitude: 51.9106846
              longitude: 4.4814932
      responses:
        '200':
          description: Shared shift started
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/StartOfficerShiftResponse'
              example:
                hub_active: true
                hub_active_until: '2026-06-08T22:00:00+00:00'
                profile:
                  id: 1
                  username: demo-officer
                  email: demo.officer@example.com
                  badge_number: BOA-0001
                  hub_id: 3
                  hub_active: true
                  hub_active_until: '2026-06-08T22:00:00+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Hub not assigned or outside hub radius
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
              examples:
                hubNotAssigned:
                  summary: Officer has no hub_id
                  value:
                    message: Officer hub assignment required before login.
                    code: hub_not_assigned
                outsideRadius:
                  summary: Coordinates outside hub radius
                  value:
                    message: Start shift requires login within hub radius.
                    code: outside_hub_radius
        '422':
          description: Shift already active or validation failed
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ShiftError'
              example:
                message: Officer shift is already active.
                code: shift_already_active

  /api/auth/logout:
    post:
      tags: [ Auth ]
      summary: Logout and revoke the current bearer token
      description: >-
        Revokes only the Sanctum personal access token on this request. For
        officers, closes the open `officer_sessions` row linked to that token.
        The shared shift (`hub_active_until`) is **not** cleared; other devices
        remain authenticated and retain workflow access until shift TTL. Inactive
        accounts may call this route (whitelisted by global inactive-actor
        middleware).
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Current token revoked
          content:
            application/json:
              schema:
                type: object
                required: [ message ]
                properties:
                  message:
                    type: string
                    example: Logged out.
              example:
                message: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/districts:
    patch:
      tags: [ Managers, Officers ]
      summary: Update my district assignments
      description: >-
        Self-service district assignment endpoint for active managers and active
        officers (including main managers). Replaces the authenticated actor's
        district assignments with the supplied district_ids array and returns the
        refreshed auth profile. Users receive **403** (`This action is
        unauthorized.`) because they do not have district assignments. Inactive
        accounts receive **403** (`This account is inactive.`) from global
        inactive-actor middleware (not whitelisted). The request updates only
        actor district pivots and never modifies the singular issues.district_id
        issue location/reference field.

        When the authenticated officer or manager has a non-null `hub_id`, every
        `district_ids` entry must reference an **active** district within that
        assigned hub (`districts.hub_id = actor.hub_id`). Cross-hub district IDs
        return **422** validation errors on `district_ids.*`. When `hub_id` is
        null, any active district is allowed. This hub boundary applies to
        **self-service only**; main managers retain city-wide issue visibility
        regardless of their district pivot assignments. Manager-admin district
        updates (`PATCH /api/managers/{managerId}/districts`,
        `PATCH /api/officers/{officerId}/districts`) enforce the target actor's
        hub separately.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DistrictAssignmentUpdate'
            example:
              district_ids: [1, 2]
      responses:
        '200':
          description: Refreshed manager or officer profile
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
              examples:
                managerProfile:
                  summary: Implemented manager self-service response
                  value:
                    actor_type: manager
                    profile:
                      id: 1
                      username: demo-manager
                      email: demo.manager@example.com
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      is_main_manager: true
                      districts:
                        - id: 1
                          name: Cool
                          postal_prefix: '3012'
                        - id: 2
                          name: Oude Westen
                          postal_prefix: '3014'
                officerProfile:
                  summary: Implemented officer self-service response
                  value:
                    actor_type: officer
                    profile:
                      id: 1
                      username: demo-officer
                      email: demo.officer@example.com
                      badge_number: BOA-0001
                      departments:
                        - id: 1
                          code: wijkbeheer
                          name: Wijkbeheer
                      districts:
                        - id: 1
                          name: Cool
                          postal_prefix: '3012'
                        - id: 2
                          name: Oude Westen
                          postal_prefix: '3014'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Users without district assignments (Forbidden) or deactivated
            accounts (InactiveAccount).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                userForbidden:
                  summary: User actor
                  value:
                    message: This action is unauthorized.
                inactiveAccount:
                  summary: Inactive bearer token
                  value:
                    message: This account is inactive.
        '422':
          description: >-
            Validation failed. Duplicate `district_ids`, unknown or inactive
            districts, or — when `hub_id` is set — district IDs outside the
            actor's assigned hub (`district_ids.*`).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'

  /api/auth/me/feed-districts:
    patch:
      tags: [ Auth ]
      summary: Update my community feed districts (users only)
      description: >-
        Self-service feed district subscription endpoint for active users.
        Replaces the authenticated user's `feedDistricts` pivot with the supplied
        `district_ids` array and returns the refreshed auth profile. User profiles
        expose subscribed districts under `profile.districts` (sourced from
        `feedDistricts`, not officer/manager assignment pivots). Officers and
        managers receive **403** (`This action is unauthorized.`) when they have
        an active shared shift. Officers without an active shared shift receive
        **403** `hub_active_required` because this route is under
        `officer.hub-active` middleware but is not Tier B whitelisted. Inactive
        accounts receive **403** (`This account is inactive.`) from global
        inactive-actor middleware.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DistrictAssignmentUpdate'
            example:
              district_ids: [1, 2]
      responses:
        '200':
          description: Refreshed user profile with feed districts
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/AuthCurrentProfileResponse'
              example:
                actor_type: user
                profile:
                  id: 1
                  username: demo-user
                  email: demo.user@example.com
                  districts:
                    - id: 1
                      name: Cool
                      postal_prefix: '3012'
                    - id: 2
                      name: Oude Westen
                      postal_prefix: '3014'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Forbidden. Officers without an active shared shift receive
            `hub_active_required` (route is not Tier B whitelisted). Officers
            and managers with an active shift receive `This action is
            unauthorized.` (users only).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                hubActiveRequired:
                  summary: Officer without active shared shift
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
                userOnly:
                  summary: Officer or manager actor
                  value:
                    message: This action is unauthorized.
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/main-managers:
    get:
      tags: [ Managers ]
      summary: List main managers
      description: >-
        List managers with `is_main_manager = true` for an authenticated active
        main manager. Results are ordered by username ascending and include each
        manager's departments and districts as compact arrays. Users, officers,
        ordinary managers, inactive managers, inactive main managers, and
        unauthenticated requests receive 403. Pagination is backend-driven using
        page and per_page, with a default per_page of 20 and maximum of 100.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Backend-paginated list of main managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/Manager'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
              example:
                data:
                  - actor_type: manager
                    id: 1
                    username: demo-manager
                    email: demo.manager@example.com
                    is_active: true
                    is_main_manager: true
                    created_by_manager_id: null
                    departments:
                      - id: 1
                        code: wijkbeheer
                        name: Wijkbeheer
