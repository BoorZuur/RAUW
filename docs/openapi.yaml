        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [ Community Posts, Attachments ]
      summary: Delete a community post attachment
      description: >-
        Hard delete one attachment from a community post. Active managers may
        delete any attachment. Active officers may delete attachments only on
        posts they authored. Requires hub-active shift for officers (Tier C).
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Attachment deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/community-posts/{communityPostId}/attachments/{attachmentId}/download:
    parameters:
      - name: communityPostId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Community Posts, Attachments ]
      summary: Download a community post attachment
      description: >-
        Stream an attachment from non-public local storage. Visibility-only
        authorization: any authenticated actor who can view the parent post may
        download. Officers may call this without a hub-active shift (Tier B).
        The attachment must belong to the post in the route; missing backing file
        returns **404**.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/community-posts/{communityPostId}/save:
    parameters:
      - name: communityPostId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Community Posts ]
      summary: Save a community post
      description: >-
        Save a visible community post to the authenticated user's saved list.
        Users only. The post must be visible and in one of the user's feed
        districts; otherwise **404**. Idempotent when already saved. Returns
        **201** with an empty JSON body.
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Post saved; empty response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Community Posts ]
      summary: Unsave a community post
      description: >-
        Remove a community post from the authenticated user's saved list. Users
        only. Returns **204** with an empty body. Idempotent when not saved.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Post unsaved; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/issues/{issueId}/chats:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issue Chat ]
      summary: List issue chats
      description: >-
        List 1:1 chats on the canonical issue. Assignee officers see all chats on
        the issue (oldest first). Eligible users (canonical owner or participant)
        see only their own chat; when none exist the response is **200** with
        `data: []`. Non-assignee officers receive **403** `not_assigned_officer`.
        Ineligible users receive **403** `not_chat_participant`. Managers receive
        **403** (`This action is unauthorized.`). Duplicate child route ids
        resolve to the canonical parent. **Tier B** for officers: no active shared
        shift required.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated list of chats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueChat'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                not_assigned_officer:
                  value:
                    message: Only the assigned officer may list chats on this issue.
                    code: not_assigned_officer
                not_chat_participant:
                  value:
                    message: You are not a participant in this chat.
                    code: not_chat_participant
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/chats/open:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issue Chat ]
      summary: Open or reopen a 1:1 chat
      description: >-
        Open (or idempotently reopen) a 1:1 chat between the assigned officer and
        an eligible user (`user_id`: canonical owner or participant). Returns **201**
        when a new chat row is created and opened; **200** when the chat is already
        open or an existing closed chat is reopened. Blocked on `gesloten` issues
        (**422** `issue_closed`). Ineligible `user_id` → **422**
        `chat_user_not_eligible`. Non-assignee officers → **403**
        `not_assigned_officer`. **Tier C** for officers (`hub_active_required`
        without an active shared shift). Managers and users receive **403**.
        Duplicate child route ids resolve to the canonical parent.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueChatOpen'
            example:
              user_id: 1
      responses:
        '200':
          description: Chat already open or reopened
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueChat'
        '201':
          description: New chat opened
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueChat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                hub_active_required:
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
                not_assigned_officer:
                  value:
                    message: Only the assigned officer may open a chat on this issue.
                    code: not_assigned_officer
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unprocessable
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                issue_closed:
                  value:
                    message: Cannot open a chat on a closed issue.
                    code: issue_closed
                chat_user_not_eligible:
                  value:
                    message: The selected user is not eligible for a chat on this issue.
                    code: chat_user_not_eligible

  /api/issues/{issueId}/chats/{chatId}/close:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: chatId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issue Chat ]
      summary: Close a single chat
      description: >-
        Close one chat on the canonical issue. Assignee officer only. Idempotent
        when the chat is already closed (**200**). Does not insert a system
        message (contrast with issue `gesloten` lifecycle). **Tier C** for
        officers. Managers and users receive **403**. Chat not on canonical issue
        → **404** `chat_not_found`.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Closed chat
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueChat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                chat_not_found:
                  value:
                    message: Chat not found for this issue.
                    code: chat_not_found

  /api/issues/{issueId}/chats/{chatId}/messages:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: chatId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issue Chat ]
      summary: List chat messages
      description: >-
        List messages for a chat in chronological order (oldest first). Allowed
        when the chat is open or closed. Only chat participants may read: assignee
        officer or the chat's `user_id`. Managers receive **403**. **Tier B** for
        officers (no active shared shift required).
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueMessage'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                not_chat_participant:
                  value:
                    message: You are not a participant in this chat.
                    code: not_chat_participant
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Issue Chat ]
      summary: Send a chat message
      description: >-
        Send a text message and/or up to three image attachments in an **open**
        chat. `content` is optional when `files` are present; at least one of
        text or attachments is required. Active users and officers may send;
        managers are excluded (**403**). Closed chat → **422** `chat_closed`.
        **Tier C** for officers. Images only: jpg, jpeg, png, gif, webp; max
        **3** files, **5 MB** each. No edit/delete in v1.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueChatMessageCreate'
      responses:
        '201':
          description: Created message
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                hub_active_required:
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
                not_chat_participant:
                  value:
                    message: You are not a participant in this chat.
                    code: not_chat_participant
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation or chat closed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                chat_closed:
                  value:
                    message: Cannot send or mark messages read while the chat is closed.
                    code: chat_closed

  /api/issues/{issueId}/chats/{chatId}/messages/mark-read:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: chatId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [ Issue Chat ]
      summary: Mark other party's messages read
      description: >-
        Mark unread messages from the other chat participant as read in an **open**
        chat. Returns `{ "marked_read": <integer> }`. Closed chat → **422**
        `chat_closed`. Active users and officers only; managers **403**. **Tier C**
        for officers.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Messages marked read
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueChatMarkReadResponse'
              example:
                marked_read: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Chat closed
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                chat_closed:
                  value:
                    message: Cannot send or mark messages read while the chat is closed.
                    code: chat_closed

  /api/issues/{issueId}/chats/{chatId}/messages/{messageId}/attachments/{attachmentId}/download:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: chatId
        in: path
        required: true
        schema:
          type: integer
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issue Chat ]
      summary: Download chat message attachment
      description: >-
        Stream a chat message attachment from non-public local storage. Only chat
        participants may download (assignee officer or the chat's `user_id`).
        Outsiders receive **403** `not_chat_participant`. Mismatched chat,
        message, or attachment ids → **404**. Users are not hub-gated; officers
        require an active shared shift (**Tier C**, route not whitelisted).
        Open or closed chat; read access follows chat membership, not chat status.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Attachment file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/ErrorResponse'
              examples:
                not_chat_participant:
                  value:
                    message: You are not a participant in this chat.
                    code: not_chat_participant
                hub_active_required:
                  value:
                    message: Hub-active session required.
                    code: hub_active_required
        '404':
          $ref: '#/components/responses/NotFound'
  /api/notifications/unread-count:
    get:
      tags: [ Notifications ]
      summary: Get unread notification count (user)
      description: >-
        Lightweight unread count for the authenticated active user. Officers and
        managers receive **403** (`This action is unauthorized.`). Use
        `GET /api/notifications` for the paginated list; this endpoint does not
        include unread count in list `meta`.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/NotificationUnreadCount'
              example:
                count: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications/bulk-read:
    patch:
      tags: [ Notifications ]
      summary: Mark multiple notifications read (user)
      description: >-
        Mark unread notifications as read for the authenticated active user by
        id. Only ids owned by the actor are updated; foreign ids are silently
        skipped. Returns the number of rows updated. Officers and managers
        receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/NotificationBulkReadRequest'
            example:
              ids: [ 1, 2, 3 ]
      responses:
        '200':
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/NotificationUpdatedCount'
              example:
                updated: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/notifications/mark-all-read:
    post:
      tags: [ Notifications ]
      summary: Mark all notifications read (user)
      description: >-
        Mark every unread notification for the authenticated active user as read.
        Not filter-scoped. Returns the number of rows updated. Officers and
        managers receive **403**.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Mark-all result
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/NotificationUpdatedCount'
              example:
                updated: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications:
    get:
      tags: [ Notifications ]
      summary: List notifications (user)
      description: >-
        Paginated list of domain notifications for the authenticated active user,
        ordered `created_at desc`, `id desc`. Officers and managers receive
        **403**. Optional filters: `is_read` (boolean), `type`
        (`NotificationType`), and `since` (ISO 8601 datetime — returns rows with
        `created_at` strictly after `since` for incremental polling). Pagination
        uses `page` and `per_page` (default **20**, max **100**).
      security:
        - bearerAuth: [ ]
      parameters:
        - name: is_read
          in: query
          required: false
          schema:
            type: boolean
          description: When set, filter by read state.
        - name: type
          in: query
          required: false
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/NotificationType'
          description: Filter by notification type.
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Return notifications created strictly after this timestamp.
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/DomainNotificationPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Notifications ]
      summary: Mark one notification read (user)
      description: >-
        Mark a single notification as read. Request body must include
        `{ "is_read": true }` only. Idempotent when already read. Returns the
        updated `DomainNotification` resource. Foreign or unknown ids return
        **404** with message `notification_not_found`. Officers and managers
        receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/NotificationMarkReadRequest'
            example:
              is_read: true
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: 'openapi/schemas.yaml#/components/schemas/DomainNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Notification not found for actor
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notification_not_found:
                  value:
                    message: notification_not_found
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/me/notifications/unread-count:
    get:
      tags: [ Notifications ]
      summary: Get unread notification count (officer)
      description: >-
        Lightweight unread count for the authenticated active officer. Officers
        may call this without an active shared shift (**Tier B**). Users and
        managers receive **403**.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/NotificationUnreadCount'
              example:
                count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/officers/me/notifications/bulk-read:
    patch:
      tags: [ Notifications ]
      summary: Mark multiple notifications read (officer)
      description: >-
        Officer mirror of `PATCH /api/notifications/bulk-read`. **Tier B** —
        no hub-active shift required. Only ids owned by the officer are updated;
        foreign ids are silently skipped.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/NotificationBulkReadRequest'
            example:
              ids: [ 10, 11 ]
      responses:
        '200':
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/NotificationUpdatedCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/me/notifications/mark-all-read:
    post:
      tags: [ Notifications ]
      summary: Mark all notifications read (officer)
      description: >-
        Officer mirror of `POST /api/notifications/mark-all-read`. **Tier B** —
        marks every unread officer notification as read.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Mark-all result
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/NotificationUpdatedCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/officers/me/notifications:
    get:
      tags: [ Notifications ]
      summary: List notifications (officer)
      description: >-
        Paginated list of domain notifications for the authenticated active
        officer. **Tier B** — officers may poll without an active shared shift.
        Same filters and pagination as the user list (`is_read`, `type`, `since`,
        `page`, `per_page`). Users and managers receive **403**.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: is_read
          in: query
          required: false
          schema:
            type: boolean
        - name: type
          in: query
          required: false
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/NotificationType'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/DomainNotificationPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/officers/me/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Notifications ]
      summary: Mark one notification read (officer)
      description: >-
        Officer mirror of `PATCH /api/notifications/{notificationId}`. **Tier B**.
        Request body must include `{ "is_read": true }`. Foreign ids return
        **404** `notification_not_found`.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/NotificationMarkReadRequest'
            example:
              is_read: true
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: 'openapi/schemas.yaml#/components/schemas/DomainNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Notification not found for actor
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notification_not_found:
                  value:
                    message: notification_not_found
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/categories:
    get:
      tags: [ Categories ]
      summary: List categories
      description: >-
        Returns main categories ordered by priority (lower number = higher
        urgency), with children ordered alphabetically by name. Categories use a
        two-level hierarchy: main
        categories have `parent_id` null; subcategories reference an active main
        category through `parent_id` and cannot have children themselves (no
        sub-under-sub). Any authenticated active actor (User, Officer, or
        Manager) may call this endpoint. Inactive accounts receive **403**
        (InactiveAccount) from global middleware.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'openapi/schemas.yaml#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
    post:
      tags: [ Categories ]
      summary: Create a category
      description: >-
        Create a main category or subcategory and assign it to one or more
        departments through the category_department pivot. Restricted to
        authenticated active main managers only. Users, officers, ordinary
        managers, inactive managers, and unauthenticated requests receive
        **403**. Categories use
        a two-level hierarchy: `parent_id` null creates a main category;
        `parent_id` must reference an active main category for subcategories.
        Subcategories cannot have children (no sub-under-sub). Main categories
        use priority (lower number = higher urgency). Subcategories order
        alphabetically by name. The legacy weight field is rejected with 422.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Categories ]
      summary: Show a category
      description: >-
        Returns a single category with departments, parent, and children. Any
        authenticated active actor (User, Officer, or Manager) may call this
        endpoint. Inactive accounts receive **403** (InactiveAccount) from global
        middleware.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Category resource
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Categories ]
      summary: Update a category
      description: >-
        Partially update a category. Include department_ids to replace the
        category's department assignments. Main categories use priority (lower
        number = higher urgency). Subcategories order alphabetically by name.
        The legacy weight field is rejected with 422. `parent_id` may only
        reference a main category; subcategories cannot
        have children. Set `is_active` to false to deactivate or true to
        reactivate; this is the sole activation path (no `/disable` route).
        Restricted to authenticated active main managers only. Users, officers,
        ordinary managers, inactive managers, and unauthenticated requests
        receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Categories ]
      summary: Replace/update a category
      description: >-
        Same behavior and validation as PATCH /api/categories/{categoryId}.
        Restricted to authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Categories ]
      summary: Hard delete an eligible category
      description: >-
        Only authenticated active main managers may hard delete categories.
        Users, officers, ordinary managers, inactive managers, and
        unauthenticated requests receive **403**. Hard deletion is guarded and
        is not the standard removal path. Prefer PATCH with `is_active: false`
        so historical issues keep their category context.
        A main category cannot be hard deleted while it still has subcategories
        (returns **409** with message `Cannot delete a main category while it
        still has subcategories.`). Categories referenced by existing issues also
        return a conflict.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Category hard deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/departments:
    get:
      tags: [ Departments ]
      summary: List departments
      description: >-
        Returns departments from the departments table with category counts.
        Requires authentication in the protected API group.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'openapi/schemas.yaml#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Departments ]
      summary: Create a department
      description: >-
        Create a department row. Mutating department endpoints are restricted to
        authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/departments/{departmentId}:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Departments ]
      summary: Show a department
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Department resource
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Departments ]
      summary: Update a department
      description: >-
        Restricted to authenticated active main managers only. Partial updates
        may include code, name, and `is_active`. Set `is_active` to false to
        deactivate or true to reactivate; this is the sole activation path (no
        `/disable` route). Deactivation returns **409** when the department is
        still referenced by existing records.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Departments ]
      summary: Replace/update a department
      description: Same behavior and validation as PATCH /api/departments/{departmentId}.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Department updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Departments ]
      summary: Delete a department
      description: >-
        Hard deletes the department row. Departments assigned to any manager or
        officer cannot be deleted until those actor assignments are changed.
        Once no actors reference the department, the category_department pivot
        uses database-level cascade deletes, and department_issue cascades the
        issue pivot assignments, so deleting a department removes only those
        assignments while leaving categories and issue rows intact. Issue
        responses expose derived read-only departments as an array. Restricted to
        authenticated active main managers only.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Department deleted; category and issue pivot assignments removed automatically
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/hubs:
    get:
      tags: [ Hubs ]
      summary: List hubs
      description: >-
        List Rotterdam cluster hubs ordered by name, including district,
        officer, and manager reference counts. Any authenticated active actor
        may call this endpoint.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Hub list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'openapi/schemas.yaml#/components/schemas/Hub'
              example:
                - id: 3
                  name: Cluster Centrum
                  address: Zalmstraat 7
                  postal_code: '3016 DS'
                  latitude: 51.9106846
                  longitude: 4.4814932
                  radius_meters: 100
                  is_active: true
                  districts_count: 6
                  officers_count: 1
                  managers_count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
    post:
      tags: [ Hubs ]
      summary: Create a hub
      description: >-
        Create a hub row. `latitude` and `longitude` are required and are not
        geocoded server-side. Optional `radius_meters` (10–5000, default 100)
        sets the hub login radius for officer hub-active evaluation. New hubs
        default to `is_active=false` when the
        field is omitted; send `is_active: true` to create an already-active
        hub. Only an authenticated, active main manager may create hubs.
        Users, officers, ordinary managers, inactive managers, and
        unauthenticated requests receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/HubCreate'
            example:
              name: Cluster Test
              address: Teststraat 1
              postal_code: '3011 AA'
              latitude: 51.92000000
              longitude: 4.48000000
              radius_meters: 100
      responses:
        '201':
          description: Hub created
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/hubs/{hubId}:
    parameters:
      - name: hubId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Hubs ]
      summary: Show a hub
      description: >-
        Returns a single hub with district, officer, and manager reference
        counts. Any authenticated active actor may call this endpoint.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Hub resource
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InactiveAccount'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Hubs ]
      summary: Update a hub
      description: >-
        Partially update a hub. Set `is_active` to false to deactivate or true
        to reactivate; this is the sole activation path (no `/disable` route).
        Deactivation returns **422** when the hub still has active districts or
        active officers assigned. Managers assigned to the hub do not block
        deactivation. Only an authenticated, active main manager may update
        hubs. Users, officers, ordinary managers, inactive managers, and
        unauthenticated requests receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/HubUpdate'
            example:
              is_active: false
      responses:
        '200':
          description: Hub updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Validation failed. Returned when field values are invalid or when
            `is_active: false` is rejected because active districts or active
            officers remain assigned to the hub.
          content:
