        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/comments:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Issue Comments ]
      summary: List comments for an issue
      description: >-
        List comments on a specific issue. Eager-loads author profiles safely.
        Returns comments sorted chronologically (oldest first). Users can only view
        visible comments and comments they authored. Officers/Managers see all.
        Officers may call this without a hub-active shift (Tier B).
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
      responses:
        '200':
          description: Paginated list of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'openapi/schemas.yaml#/components/schemas/IssueComment'
                  links:
                    type: object
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      last_page:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [ Issue Comments ]
      summary: Add a comment to an issue
      description: >-
        Add a new comment to a specific issue. Active users, active officers, and
        active managers may create comments. Officers require a hub-active shift
        (Tier C); users and managers do not. Content is limited to 2000 characters.
        When the issue owner comments on an anonymous issue, the response redacts
        the author to the issue's stable alias (`is_anonymous: true`,
        `display_name` only); there is no request flag to opt into anonymity.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueCommentCreate'
            example:
              content: Dit is een nieuwe opmerking op de melding.
      responses:
        '201':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueComment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/issues/{issueId}/comments/{commentId}:
    parameters:
      - name: issueId
        in: path
        required: true
        schema:
          type: integer
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [ Issue Comments ]
      summary: Update own comment
      description: >-
        Update comment content. Only the author of the comment may perform this
        update. Requires active shift for officers (Tier C).
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/IssueCommentUpdate'
            example:
              content: Dit is de bijgewerkte tekst van de opmerking.
      responses:
        '200':
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueComment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Issue Comments ]
      summary: Delete a comment
      description: >-
        Delete a comment. Only the author or any active manager may perform this action.
        Requires active shift for officers (Tier C).
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Comment deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/comments/{commentId}/visibility:
    parameters:
      - name: issueId
        in: path
