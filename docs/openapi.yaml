                    code: not_update_author
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Validation failure, invalid `remove_attachment_ids`, or issue status
            is `gesloten` (`issue_closed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowUnprocessableError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
              examples:
                issue_closed:
                  value:
                    message: Cannot create, update, or delete an officer update on a closed issue.
                    code: issue_closed
    delete:
      tags: [ Issues ]
      summary: Delete officer update
      description: >-
        Delete an officer update and its attachments. Only the authenticated
        active officer currently assigned to the issue may delete it (**403**
        `not_assigned_officer` otherwise). Only the officer who authored the
        update may delete it (**403** `not_update_author` otherwise). Officers
        without an active shared shift receive **403** `hub_active_required`.
        District scoping applies (**403** `officer_not_in_district`). Blocked
        when issue status is `gesloten` (**422** `issue_closed`); issues in
        `opgelost` remain writable. Returns **404** when the update does not
        exist on the issue.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Update deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden (see assign-self for structured codes)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/OfficerWorkflowError'
                  - $ref: 'openapi/schemas.yaml#/components/schemas/Error'
              examples:
                notAssignedOfficer:
                  summary: Officer is not the current assignee
                  value:
                    message: Only the assigned officer may submit updates for this issue.
                    code: not_assigned_officer
                notUpdateAuthor:
                  summary: Officer is assignee but not the update author
                  value:
                    message: Only the officer who authored this update may modify or delete it.
                    code: not_update_author
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            Issue status is `gesloten` (`issue_closed`).
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/IssueWorkflowUnprocessableError'
              examples:
                issue_closed:
                  value:
                    message: Cannot create, update, or delete an officer update on a closed issue.
                    code: issue_closed

  /api/issues/{issueId}/officer-updates/attachments/{attachmentId}/download:
    parameters:
