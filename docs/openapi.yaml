            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/HubUpdate'
      responses:
        '200':
          description: Hub updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Hubs ]
      summary: Delete an eligible hub
      description: >-
        Hard delete a hub. Only an authenticated, active main manager may delete
        hubs. Deletion returns **409 Conflict** when districts, officers, or
        managers still reference the hub.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Hub deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/districts:
    get:
      tags: [ Districts ]
      summary: List districts
      description: >-
        List districts ordered by name, each with hub metadata, manager/officer
        assignment counts, and issue reference counts when available. Requires
        authentication in the protected API group. District records are separate
        from actor assignments: managers and officers are assigned through
        district_manager and district_officer pivots, while issues.district_id
        remains a singular issue location/reference field.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Districts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'openapi/schemas.yaml#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Districts ]
      summary: Create a district
      description: >-
        Create a district row. `hub_id`, `center_lat`, and `center_lng` are
        required; coordinates are not geocoded server-side. `hub_id` must
        reference an existing active hub (`is_active=true`); inactive or
        unknown hub IDs return **422**. Only an authenticated, active main manager
        (`is_main_manager=true`) may create, update, or delete districts. Users,
        officers, ordinary managers, inactive managers, and unauthenticated
        requests receive **403** (`This action is unauthorized.`). District CRUD
        manages district records only; actor assignments use district_ids
        endpoints and issue district references are not reassigned.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DistrictCreate'
            example:
              name: Nieuwe Wijk
              hub_id: 3
              postal_prefix: '3017'
              center_lat: 51.91000000
              center_lng: 4.48000000
              radius_meters: 1200
              is_active: true
      responses:
        '201':
          description: District created
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/districts/{districtId}:
    parameters:
      - name: districtId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [ Districts ]
      summary: Show a district
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: District resource
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Districts ]
      summary: Update a district
      description: >-
        Only an authenticated, active main manager may update districts. Users,
        officers, ordinary managers, inactive managers, and unauthenticated
        requests receive **403**. Set `is_active` to false to deactivate or true
        to reactivate; this is the sole activation path (no `/disable` route).
        Deactivating (`is_active: false`) orphans community posts in that
        district (`district_id` set to null) and removes the district from all
        user feed pivots (`DetachDistrictFromCommunityFeeds`).
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DistrictUpdate'
            example:
              name: Nieuwe Wijk bijgewerkt
              is_active: true
      responses:
        '200':
          description: District updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [ Districts ]
      summary: Replace/update a district
      description: >-
        Same behavior and validation as PATCH /api/districts/{districtId}.
        Only an authenticated, active main manager may call district writes;
        others receive **403**.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'openapi/schemas.yaml#/components/schemas/DistrictUpdate'
      responses:
        '200':
          description: District updated
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas.yaml#/components/schemas/District'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ Districts ]
      summary: Delete an eligible district
      description: >-
        Only an authenticated, active main manager may delete districts. Users,
        officers, ordinary managers, inactive managers, and unauthenticated
        requests receive **403**. Deletion returns **409 Conflict** when the
        district is still assigned to any manager, assigned to any officer, or
        referenced by any issue through issues.district_id.
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: District deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ConflictError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >-
        Laravel Sanctum personal access token sent as `Authorization: Bearer
        {token}`. Tokens expire after 7 days (10080 minutes;
        `SANCTUM_TOKEN_EXPIRATION`). Required on all `/api/*` routes except public
        auth registration and login. After the token resolves to a user, officer, or
        manager, the
        `actor.active` middleware returns **403** with `code: account_inactive`
        when `is_active` is false, except on whitelisted routes: GET
        `/api/auth/me`, POST `/api/auth/logout`, and PATCH `/api/auth/me`. Other
        **403** responses on protected routes use `This action is unauthorized.`
        when FormRequest authorization fails. Officers without an active shared
        shift (`hub_active_until` null or past) receive **403** with
        `code: hub_active_required` on Tier C (workflow write) routes. Tier B
        browse routes remain available without a shift: issue list/show,
        officer-resolution show, officer-updates index, comments index, and
        issue/resolution/officer-update attachment downloads.
        Whitelisted routes also include profile, start-shift, and reference reads.
        See `#/components/responses/InactiveAccount`,
        `#/components/responses/Forbidden`, and `#/components/responses/HubActiveRequired`.

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    perPage:
      name: per_page
      in: query
      description: Backend-driven page size. Defaults to 20 and is capped at 100.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/ValidationError'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/Error'
    Forbidden:
      description: >-
        FormRequest authorization failed on a protected route (`This action is
        unauthorized.`). Not used for deactivated accounts; those receive
        InactiveAccount from global middleware instead.
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/Error'
          example:
            message: This action is unauthorized.
    InactiveAccount:
      description: >-
        Authenticated account is inactive. Returned by global middleware on
        protected routes when the bearer token is valid but the actor's account
        is deactivated. Whitelisted while inactive: GET /api/auth/me, POST
        /api/auth/logout, PATCH /api/auth/me. Login rejects inactive credentials
        with 401.
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/AccountInactiveError'
          example:
            message: This account is inactive.
            code: account_inactive
    HubActiveRequired:
      description: >-
        Authenticated officer lacks an active shared shift. Returned by
        `officer.hub-active` middleware on Tier C routes when the officer is
        inactive or `hub_active_until` is null or in the past. The middleware
        does not inspect the bearer token's Sanctum `hub-active` ability.
        Tier B browse routes (issue list/show, issue comments index,
        officer-resolution show, attachment downloads) and other whitelisted
        routes (profile, start-shift, reference reads) do not require an active
        shift.
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/HubError'
          example:
            message: Hub-active session required.
            code: hub_active_required
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/Error'
          example:
            message: Resource not found.
    ConflictError:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/ConflictError'
    ServerError:
      description: >-
        Unexpected server error. With APP_DEBUG=false, responses use a safe
        generic message and never include SQL, bindings, or stack traces.
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas.yaml#/components/schemas/Error'
          example:
            message: Server error.
